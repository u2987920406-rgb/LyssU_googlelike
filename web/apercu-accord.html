.pt{width:auto;height:auto;border-radius:0;background:none!important;margin-top:1px;
  display:grid;place-items:center;flex:none}
.lienr{font-weight:600;color:var(--text);cursor:pointer;
  background:rgba(249,171,0,.28);border-radius:3px;padding:1px 5px;
  border-bottom:2px solid var(--amber);
  transition:background .14s ease,border-color .14s ease}
.lienr:hover{background:rgba(249,171,0,.52)}
.lienr.rouge{border-bottom-color:#B3261E}
.liena{border-bottom-color:var(--amber)}
.liena:hover{background:rgba(249,171,0,.52)}
.dette .act{align-self:flex-start}
.dette .act .go{background:var(--text);color:var(--bg);font-weight:500}


/* ═══════════════════════════════════════════════════════════════════
   ALERTER ET AGIR SONT DEUX CHOSES

   Le mot surligné en jaune ne se lisait pas comme un lien — il se
   lisait comme une notion importante. Normal : le surlignage dit
   « retenez ça », pas « cliquez ici ». Deux messages différents dans
   une seule marque, donc aucun des deux.

   On les sépare :
     · le TRIANGLE jaune alerte ;
     · le LIEN agit, et il a tous les signes d'un lien — la couleur
       d'action de l'application, un soulignement, une graisse
       moyenne, la typo à chasse fixe du nom de fichier, et une
       flèche sortante.

   Quatre signaux qui disent tous « clic ». Aucun ne dit « important » :
   c'est le triangle qui s'en charge.
   ═══════════════════════════════════════════════════════════════════ */
.lienr{color:var(--accent);font-weight:500;cursor:pointer;background:none;
  font-family:ui-monospace,Menlo,"SF Mono",monospace;font-size:.93em;
  border-bottom:1.5px solid var(--accent);border-radius:0;padding:0 0 1px;
  white-space:nowrap;transition:background .14s ease}
.lienr::after{content:' ↗';font-family:var(--font-ui);font-size:1.05em}
.lienr:hover{background:var(--accent-bg)}
.lienr.rouge,.liena{border-bottom-color:var(--accent)}
.lienr.rouge:hover,.liena:hover{background:var(--accent-bg)}


/* ═══════════════════════════════════════════════════════════════════
   LA REPRISE DE CONTEXTE

   Le cas vécu : on dit « relance », et l'agent ne sait pas quoi
   relancer — alors que la conversation est là, ouverte, avec tout
   dedans. Ce n'est pas une panne de mémoire. C'est une panne d'ORDRE :
   il est allé chercher loin sans avoir regardé près.

       AVANT DE CHERCHER LOIN, RELIRE PRÈS.

   Face à une demande qui suppose un contexte — « relance »,
   « continue », « comme tout à l'heure », « ça ne marche pas » —
   l'ordre est fixe et ne varie jamais :

     1. le fil visible, celui qu'on a sous les yeux ;
     2. le plan en cours et l'état de ses étapes ;
     3. la dernière séance résumée ;
     4. et seulement alors, demander.

   Et il DIT ce qu'il a relu. Une reprise silencieuse est une devinette
   déguisée : si l'on ne sait pas d'où vient sa réponse, on ne peut pas
   corriger sa méprise.
   ═══════════════════════════════════════════════════════════════════ */
.relu{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);
  background:var(--surface);border-radius:var(--radius-md);padding:10px 14px;
  margin-bottom:14px;animation:rise .3s cubic-bezier(.2,0,0,1) both}
[data-d="epure"] .relu{background:none;padding:10px 0 0;border-top:1px solid rgba(31,31,31,.08)}
.relu b{color:var(--text);font-weight:500}
.relu .st{flex:none;margin-top:2px;color:var(--muted)}


/* ═══════════════════════════════════════════════════════════════════
   REMPLIR user.md SANS VOIR DE MARKDOWN

   Une zone de texte vide devant quelqu'un qui n'a jamais écrit de
   markdown, c'est la page blanche. Les cinq questions deviennent donc
   cinq champs, chacun avec son invite au-dessus et **son exemple en
   filigrane dans le champ**.

       L'EXEMPLE VA DANS LE CHAMP, PAS À CÔTÉ.

   Un exemple posé sous le champ se lit comme une consigne de plus. Le
   même texte en filigrane se lit comme « voilà à quoi ressemblerait
   votre réponse » — et il disparaît dès qu'on tape.

   Le fichier reste consultable d'un lien : rien n'est caché, mais
   personne n'est obligé de le regarder.
   ═══════════════════════════════════════════════════════════════════ */
.qbloc{padding:18px 0;border-bottom:1px solid rgba(31,31,31,.07)}

/* ═══ Régression de la décision 19, trouvée par l'audit sur images ══
   Le bandeau de dette est entièrement rouge sur les 27 captures du
   lot 4c. À 760 px il occupe trois lignes pleines en haut de l'écran.

     LA COULEUR NE COLORE PAS LE MESSAGE — ELLE DÉSIGNE LE MOT.

   Ce n'est pas neuf : la correction avait été faite une première
   fois, puis **perdue quand le texte a été réécrit** pour le rendre
   plus concret. Une règle qui vit dans une chaîne de caractères se
   perd à la première réécriture de cette chaîne.

   Posé ici, en fin de feuille, volontairement : après quatre passes
   perdues aujourd'hui à raffiner des cascades, on choisit ce qui ne
   peut pas être défait par une règle écrite plus haut.
   ═══════════════════════════════════════════════════════════════ */

/* ===== La carte d'un fichier, dans le fil =====
   Dans le fil, une carte est une MENTION — pas un panneau de commandes. Une
   seule action : Ouvrir. Source, copie et téléchargement sont dans le volet.
   La deuxième ligne dit OÙ IL EST, tronqué PAR LA TÊTE : la fin d'un chemin
   dit où l'on est, le début dit ce qu'on savait déjà. */
.f-carte{display:inline-flex;align-items:center;gap:12px;padding:11px 14px;margin:6px 0;

   fichier absent est un bouton mort. En ambre — ce n'est pas une panne. */
.f-carte.absent{cursor:default;border-style:dashed;box-shadow:none;

/* ── LE FOND DE L'AFFAIRE ────────────────────────────────────────────────
   La question du relais était : comment faire tenir quatre choix dans une
   bulle qui en porte deux ?

   En cherchant où mettre le troisième bouton, on tombe sur plus gros :
   **la demande n'apparaît nulle part dans le fil.** `conv.approval` est
   posé par le core, `onApproval()` en fait une notification — et
   `paintThread()` ne le rend pas. L'agent est bloqué, on regarde Discuter,
   et la seule chose qui le dise est une cloche dans un menu replié.

   Donc la bulle ne portera pas quatre choix. Elle en gardera DEUX — c'est
   le geste rapide quand on est ailleurs — et les quatre iront là où il y a
   la place de dire ce qu'ils engagent : **dans le fil, à leur place
   chronologique**, avec `.ask` et `.opt`, le langage que la maquette a
   dessiné pour exactement ça.

   Un choix dont on ne mesure pas la portée n'est pas un choix. « Toujours »
   ne peut pas être un bouton de 34 px à côté de trois autres. */

/* Le bloc d'accord dans le fil. `.ask`, `.opt`, `.tick` viennent de la
   maquette — on n'ajoute rien, on s'en sert. */
.p-accord{display:block}
.p-accord .ask{border-left:3px solid var(--amber)}
.p-accord .ask .q{display:flex;align-items:center;gap:9px}
.p-accord .ask .q svg{color:var(--amber);flex:none}
/* Ce que l'agent s'apprête à faire, en toutes lettres et à part : c'est la
   seule chose qu'on doit lire avant de répondre. */
.p-quoi{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;
  background:var(--bg);border-radius:var(--radius-sm);padding:10px 14px;
  margin:10px 0 16px;word-break:break-word;color:var(--text)}
/* Chaque option porte sa portée. La conséquence se lit sous le libellé,
   pas dans une infobulle. */
.p-accord .opt{align-items:flex-start;padding:13px 16px}
.p-accord .opt .tick{margin-top:1px}
.p-accord .opt .tx{flex:1;min-width:0}
.p-accord .opt .sub{display:block;font-size:var(--font-size-xs);color:var(--muted);
  margin-top:2px;line-height:1.45}
.p-accord .opt.pick .sub{color:var(--on-accent-container);opacity:.8}
/* « Toujours » engage au-delà de cette session : il se sépare des deux
   autres par un filet, et porte sa réserve. Il n'est pas interdit — il est
   distingué. */
.p-accord .p-sep{height:1px;background:var(--outline-var);margin:12px 2px}
.p-accord .opt.p-fort .tick{border-color:var(--amber)}
.p-accord .opt.p-fort.pick .tick{border-color:var(--accent);background:var(--accent)}
/* Refuser n'est pas une option parmi quatre : c'est l'autre réponse. Il
   quitte la liste et redevient un bouton, à droite. */
.p-accord .p-bas{display:flex;align-items:center;gap:12px;margin-top:14px}
.p-accord .p-bas .l{flex:1;font-size:var(--font-size-xs);color:var(--faint);
  line-height:1.5}

/* La bulle de notification ne change pas de forme — elle gagne un renvoi.
   Elle est le RAPPEL, pas le lieu de la décision. */
.p-lien{display:block;margin-top:9px;font-size:var(--font-size-xs);
  color:var(--accent);cursor:pointer}

/* En proposé, la bulle ne prétend plus proposer la portée : son « oui »
   vaut « une fois », et c'est écrit. */
.p-only{display:inline}
</style>
</head>

 corbeille:{raw:`<path d="M4 7h16"/><path d="M9.5 7V5.2a1.2 1.2 0 0 1 1.2-1.2h2.6a1.2 1.2 0 0 1 1.2 1.2V7"/>

function svg(k,{size=24,fill=false,w=2}={}){
  const o=I[k]||{}, sw=o.w||w;
  /* Un glyphe « plein » n'est jamais un aplat : c'est sa propre couleur
     à 18 %. Le contour reste net, la masse reste légère. */
  const wrap=(inner,f)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24"
    fill="${f||'none'}" fill-opacity="${f&&f!=='none'?'.12':'1'}"
    stroke="currentColor" stroke-width="${sw}" stroke-linecap="round"
    stroke-linejoin="round">${inner}</svg>`;
  if(o.circle) return `<svg width="${size}" height="${size}" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="5" fill="currentColor"/></svg>`;
  if(o.people) return wrap(`<circle cx="9" cy="8" r="3.2"/>
    <path d="M3 19a6 6 0 0 1 12 0"/><circle cx="17" cy="9.5" r="2.4"/>
    <path d="M15.5 19h5.5a4.5 4.5 0 0 0-3-4.2"/>`, fill?'currentColor':'none');
  if(o.nodes) return wrap(`<circle cx="6" cy="6" r="2.6"/><circle cx="18" cy="10" r="2.6"/>
    <circle cx="8" cy="18" r="2.6"/><path d="M8.4 7.1 15.5 9.3M7.4 8.5 7.9 15.4" fill="none"/>`,
    fill?'currentColor':'none');
  if(o.tune) return wrap(`<path d="M4 7h6M15 7h5M4 12h11M4 17h3M12 17h8" fill="none"/>
    <circle cx="12.5" cy="7" r="2.3"/><circle cx="17.5" cy="12" r="2.3"/>
    <circle cx="9.5" cy="17" r="2.3"/>`, fill?'currentColor':'none');
  if(o.raw) return wrap(o.raw);
  if(o.fillable) return wrap(`<path d="${o.fillable}"/>`,fill?'currentColor':'none');
  return wrap(`<path d="${o.d}"/>`);
}

<script>
/* ═══ Banc d'essai. ═══ */
const $ = (id) => document.getElementById(id);
const H = (id, h) => { const n = $(id); if (n) n.innerHTML = h; };
const ech = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

let propose = false, etat = "attente", choix = null, notifOuverte = false;

/* La demande, telle qu'Hermès l'envoie. */
const DEMANDE = {
  tool: "fs.write",
  command: "web/ulysse.html",
  reason: "L'agent veut écrire dans un fichier du produit",
  choices: ["once", "session", "always", "deny"]
};

/* Ce que chaque choix engage. C'est ça qu'on doit pouvoir lire — pas son
   nom technique. */
const PORTEE = {
  once:    ["Autoriser cette fois",
            "Seulement cette action-ci. On vous redemandera à la suivante."],
  session: ["Autoriser pour cette conversation",
            "Jusqu'à ce que ce fil se ferme. Une nouvelle conversation redemandera."],
  always:  ["Autoriser toujours",
            "Pour toutes les conversations à venir, sans limite de temps."]
};

function tour(){
  return '<div class="msg you"><div class="u-who">Vous</div>'
    + "<p>Applique la passe de design sur Discuter.</p></div>"
    + '<div class="msg ulysse"><div class="u-who">Ulysse</div>'
    + '<div class="u-tools">'
    + '<div class="u-tool done"><span class="d"></span><div style="flex:1;min-width:0">'
    + '<span class="n">fs.read</span><div class="c">web/PASSE-DESIGN-DISCUTER.md</div>'
    + '</div><span class="z">90 ms</span></div>'
    + '<div class="u-tool"><span class="d"></span><div style="flex:1;min-width:0">'
    + '<span class="n">fs.write</span><div class="c">web/ulysse.html</div>'
    + "</div><span class=\"z\">" + (etat === "attente" ? "attend votre accord" : "210 ms")
    + "</span></div></div>"
    + (etat === "attente"
        ? "<p>J'ai lu la passe. Avant d'écrire dans le produit, j'ai besoin de votre "
          + "accord.</p>"
        : "<p>C'est écrit. Les six réparations sont en place ; il reste le style des "
          + "cinq passes.</p>")
    + accordHTML()
    + "</div>";
}

/* ── LE BLOC D'ACCORD, DANS LE FIL ──────────────────────────────────────
   En ACTUEL il n'existe pas : `paintThread()` ne rend jamais `conv.approval`.
   En PROPOSÉ c'est un `.ask` de la maquette, avec ses `.opt` et ses `.tick`. */
function accordHTML(){
  if (!propose) return "";

  if (etat === "repondu"){
    const k = choix || "once";
    if (k === "deny"){
      return '<div class="p-accord"><div class="ask done">'
        + '<button class="opt pick" style="background:#FCE8E6;color:#B3261E">'
        + '<span class="tick" style="border-color:#B3261E;background:#B3261E;color:#fff">'
        + svg("fermer", { size: 14 }) + "</span>"
        + '<span class="tx">Refusé — l\'agent n\'a pas écrit.</span></button>'
        + "</div></div>";
    }
    return '<div class="p-accord"><div class="ask done">'
      + '<button class="opt pick"><span class="tick">' + svg("coche", { size: 14 })
      + "</span>"
      + '<span class="tx">' + ech(PORTEE[k][0])
      + '<span class="sub">' + ech(PORTEE[k][1]) + "</span></span></button>"
      + "</div></div>";
  }

  const opt = (k, fort) =>
    '<button class="opt' + (choix === k ? " pick" : "") + (fort ? " p-fort" : "")
    + '" data-ch="' + k + '"><span class="tick">'
    + (choix === k ? svg("coche", { size: 14 }) : "") + "</span>"
    + '<span class="tx">' + ech(PORTEE[k][0])
    + '<span class="sub">' + ech(PORTEE[k][1]) + "</span></span></button>";

  const dispo = DEMANDE.choices;
  return '<div class="p-accord"><div class="ask">'
    + '<div class="q">' + svg("alerte", { size: 19 }) + "Votre accord est demandé</div>"
    + '<div class="hint">' + ech(DEMANDE.reason)
    + ". Rien ne se fait tant que vous n'avez pas répondu.</div>"
    + '<div class="p-quoi">' + ech(DEMANDE.tool) + "  ·  " + ech(DEMANDE.command) + "</div>"
    + (dispo.indexOf("once") >= 0 ? opt("once") : "")
    + (dispo.indexOf("session") >= 0 ? opt("session") : "")
    + (dispo.indexOf("always") >= 0
        ? '<div class="p-sep"></div>' + opt("always", true) : "")
    + '<div class="p-bas">'
    + '<span class="l">Vous pourrez revenir sur « toujours » dans Réglages · '
    + "Sécurité et accords.</span>"
    + '<button class="dangerlink" data-ch="deny">Refuser</button></div>'
    + "</div></div>";
}

/* ── LA BULLE DE NOTIFICATION ───────────────────────────────────────────
   Deux boutons, comme aujourd'hui. En proposé elle dit ce que son « oui »
   vaut, et renvoie au fil pour le reste. */
function notif(){
  if (etat === "repondu"){
    H("npanel", '<div class="empty" style="padding:40px 20px">'
      + '<div class="big">Rien à signaler.</div><div>On vous préviendra.</div></div>');
    return;
  }
  H("npanel",
    '<div class="ngroup">À décider · 1<span class="l"></span></div>'
    + '<div class="nrow"><span class="nic" style="background:var(--accent-container);'
    + 'color:var(--accent)">' + svg("coffre", { size: 19 }) + "</span>"
    + '<div style="flex:1;min-width:0">'
    + '<div class="nt">Votre accord est demandé</div>'
    + '<div class="nx">' + ech(DEMANDE.reason) + " — " + ech(DEMANDE.command) + "</div>"
    + '<div class="nmeta"><span class="o">Projet Ulysse</span>·<span>à l\'instant</span></div>'
    + '<div class="nacts">'
    + '<button class="yes" data-n="once">Autoriser'
    + '<span class="p-only" style="display:none"> une fois</span></button>'
    + '<button class="no" data-n="deny">Refuser</button></div>'
    + (propose
        ? '<span class="p-lien" id="versFil">Voir la demande dans Discuter — '
          + "pour autoriser plus largement</span>" : "")
    + "</div></div>");
  $("npanel").querySelectorAll("[data-n]").forEach((b) => {
    b.onclick = (e) => { e.stopPropagation(); repondre(b.dataset.n); };
  });
  const v = $("versFil");
  if (v) v.onclick = () => { fermerNotif(); souffle("Le fil défile jusqu'à la demande."); };
}

function repondre(k){
  choix = k; etat = "repondu";
  majSeg("apEtat", "repondu");
  fermerNotif();
  dessine();
  souffle(k === "deny" ? "Refusé — l'agent n'a pas écrit."
    : "Autorisé : " + PORTEE[k][0].toLowerCase() + ".");
}

function fermerNotif(){ notifOuverte = false; $("npanel").classList.remove("on"); }

function dessine(){
  H("thread", tour());
  $("thread").querySelectorAll("[data-ch]").forEach((b) => {
    b.onclick = () => repondre(b.dataset.ch);
  });

  const k = etat === "attente" ? 1 : 0;
  H("bellIc", svg("cloche", { size: 22, w: 1.6 })
    + (k ? '<span class="badge dec" style="top:-2px;left:14px">' + k + "</span>" : ""));

  notif();
  ["plus1","mic1","snd1"].forEach((i, n) =>
    H(i, svg(["plus","micro","envoi"][n], { size: 24 })));
  majNote();
}

$("bell").onclick = (e) => {
  e.stopPropagation();
  notifOuverte = !notifOuverte;
  $("npanel").classList.toggle("on", notifOuverte);
  if (notifOuverte) notif();
};
document.addEventListener("click", () => fermerNotif());
$("npanel").onclick = (e) => e.stopPropagation();

let souffleT = null;
function souffle(t){
  let el = $("apSouffle");
  if (!el){
    el = document.createElement("div");
    el.id = "apSouffle";
    el.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:22px;"
      + "z-index:900;background:#1F1F1F;color:#fff;font-size:12.5px;padding:9px 18px;"
      + "border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.35);transition:opacity .25s";
    document.body.appendChild(el);
  }
  el.textContent = t; el.style.opacity = "1";
  clearTimeout(souffleT);
  souffleT = setTimeout(() => { el.style.opacity = "0"; }, 2600);
}

function majSeg(id, v){
  $(id).querySelectorAll("button").forEach((b) =>
    b.classList.toggle("on", (b.dataset.e || b.dataset.v) === v));
}
$("apEtat").onclick = (e) => {
  const b = e.target.closest("[data-e]"); if (!b) return;
  etat = b.dataset.e; if (etat === "attente") choix = null;
  majSeg("apEtat", etat); dessine();
};
$("apVers").onclick = (e) => {
  const b = e.target.closest("[data-v]"); if (!b) return;
  majSeg("apVers", b.dataset.v);
  propose = b.dataset.v === "1";
  $("propose").media = propose ? "all" : "not all";
  dessine();
};

dessine();
