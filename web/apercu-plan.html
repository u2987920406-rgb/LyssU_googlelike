.dette.rouge .act .go{background:#8C1D18;color:#FCE8E6}
.dette .act .go:hover{opacity:.88}
.dette .act .later{color:inherit;opacity:.72}
.dette .act .later:hover{background:rgba(0,0,0,.07);opacity:1}
/* Réduite : elle reste, mais elle ne prend plus la parole. */
.dette.mini{padding:7px 14px;font-size:13.5px;cursor:pointer;
  margin-bottom:0;align-self:flex-start}
.dette.mini .act,.dette.mini .plus{display:none}
.dette.mini:hover{filter:brightness(.97)}
.dettewrap{padding:0 0 10px var(--space-4);display:flex;flex-direction:column}


/* ═══════════════════════════════════════════════════════════════════
   LES AVERTISSEMENTS, INTÉGRÉS

   Les aplats ambre et rouge détonnaient — ils venaient d'un autre
   monde que le reste de l'interface. Même erreur que l'icône noire :
   on avait pris « important » pour « saturé ».

   La règle est la même, et elle vaut maintenant partout :

       UN AVERTISSEMENT, C'EST UN FILET DE COULEUR SUR UNE SURFACE
       NEUTRE. JAMAIS UN APLAT COLORÉ.

   La surface reste celle de l'application, le texte reste noir, et
   seul un trait de 3 px porte la couleur. La gravité se lit à sa
   teinte, pas à la surface qu'elle occupe. Un aplat crie une fois ;
   un filet tient toute la journée.
   ═══════════════════════════════════════════════════════════════════ */
.dette{background:var(--surface);color:var(--text);
  border-left:3px solid var(--amber);border-radius:0 var(--radius-md) var(--radius-md) 0}
.dette.rouge{border-left-color:#B3261E}
.dette .ic{color:var(--amber);opacity:1}
.dette.rouge .ic{color:#B3261E}
.dette .act .go{background:var(--text);color:var(--bg)}
.dette.rouge .act .go{background:var(--text);color:var(--bg)}
.dette .act .later{color:var(--muted);opacity:1}
.dette.mini{background:var(--surface)}

.avert,.irrev,.warnbox{background:var(--surface);color:var(--text);
  border-left:3px solid var(--amber);border-radius:0 var(--radius-md) var(--radius-md) 0}

.warnbox{border-left-color:var(--outline-var)}
.warnbox svg{color:var(--muted)}
[data-d="epure"] .avert,[data-d="epure"] .warnbox{background:none;border-left:none;
  color:var(--muted);padding-left:0}
[data-d="epure"] .dette{background:none;padding-left:14px}
.fqui.fvide{background:var(--surface)!important;color:var(--amber)}


/* ═══════════════════════════════════════════════════════════════════
   LE ROUGE, AU BON ENDROIT

   L'aplat criait, le filet seul ne disait plus rien. La bonne mesure
   est entre les deux, et elle tient en deux marques :

     · un POINT de couleur, avant le texte — il annonce la gravité ;
     · le MOT qui compte, en gras, souligné de rouge, cliquable — il
       porte l'action.

   Le reste de la phrase est noir sur surface neutre. Le rouge
   n'occupe donc que deux endroits minuscules, mais les deux seuls
   qui comptent : ce dont il s'agit, et où aller.

       LA COULEUR NE COLORE PAS LE MESSAGE — ELLE DÉSIGNE LE MOT.
   ═══════════════════════════════════════════════════════════════════ */
.pt{width:9px;height:9px;border-radius:50%;flex:none;margin-top:7px;background:var(--amber)}
.pt.rouge{background:#B3261E}
.lienr{font-weight:600;color:var(--text);cursor:pointer;
  border-bottom:2px solid #B3261E;padding-bottom:1px;white-space:nowrap;
  transition:background .14s ease}
.lienr:hover{background:rgba(179,38,30,.10)}
.liena{border-bottom-color:var(--amber)}
.liena:hover{background:rgba(227,116,0,.12)}
.dette{border-left:none;border-radius:var(--radius-md);align-items:flex-start;
  padding:13px 16px}
.dette .ic{display:none}
.dette.mini{align-items:center;padding:8px 14px}
.dette.mini .pt{margin-top:0}
.avert,.irrev,.warnbox{border-left:none;border-radius:var(--radius-md)}
.avert .pt svg,.irrev .pt svg,.dette .pt svg{display:block}


/* ═══════════════════════════════════════════════════════════════════
   PRÉVENIR, SANS CRIER — la forme finale

   Trois marques, et pas une de plus :

     · un TRIANGLE jaune, 17 px, en tête — la forme universelle de
       l'alerte, reconnue même sans savoir lire ;
     · le MOT surligné en jaune, gras, souligné — il se voit comme un
       surligneur sur du papier, donc on devine qu'on peut cliquer
       dessus avant même de survoler ;
     · un BOUTON, à droite — parce qu'un lien dans une phrase peut
       être manqué, et qu'on n'a pas le droit de faire dépendre le
       rattrapage d'un détail typographique.

   Le rouge ne subsiste que sur 2 px de soulignement, quand c'est
   grave. Le reste est jaune, et le jaune n'occupe qu'un mot.
   ═══════════════════════════════════════════════════════════════════ */
.pt{width:auto;height:auto;border-radius:0;background:none!important;margin-top:1px;
  display:grid;place-items:center;flex:none}
.lienr{font-weight:600;color:var(--text);cursor:pointer;
  background:rgba(249,171,0,.28);border-radius:3px;padding:1px 5px;
  border-bottom:2px solid var(--amber);
  transition:background .14s ease,border-color .14s ease}
.lienr:hover{background:rgba(249,171,0,.52)}
.lienr.rouge{border-bottom-color:#B3261E}
.liena{border-bottom-color:var(--amber)}
.liena:hover{background:rgba(249,171,0,.52)}
.dette .act{align-self:flex-start}
.dette .act .go{background:var(--text);color:var(--bg);font-weight:500}


/* ═══════════════════════════════════════════════════════════════════
   ALERTER ET AGIR SONT DEUX CHOSES

   Le mot surligné en jaune ne se lisait pas comme un lien — il se
   lisait comme une notion importante. Normal : le surlignage dit
   « retenez ça », pas « cliquez ici ». Deux messages différents dans
   une seule marque, donc aucun des deux.

   On les sépare :
     · le TRIANGLE jaune alerte ;
     · le LIEN agit, et il a tous les signes d'un lien — la couleur
       d'action de l'application, un soulignement, une graisse
       moyenne, la typo à chasse fixe du nom de fichier, et une
       flèche sortante.

   Quatre signaux qui disent tous « clic ». Aucun ne dit « important » :
   c'est le triangle qui s'en charge.
   ═══════════════════════════════════════════════════════════════════ */
.lienr{color:var(--accent);font-weight:500;cursor:pointer;background:none;
  font-family:ui-monospace,Menlo,"SF Mono",monospace;font-size:.93em;
  border-bottom:1.5px solid var(--accent);border-radius:0;padding:0 0 1px;
  white-space:nowrap;transition:background .14s ease}
.lienr::after{content:' ↗';font-family:var(--font-ui);font-size:1.05em}
.lienr:hover{background:var(--accent-bg)}
.lienr.rouge,.liena{border-bottom-color:var(--accent)}
.lienr.rouge:hover,.liena:hover{background:var(--accent-bg)}


/* ═══════════════════════════════════════════════════════════════════
   LA REPRISE DE CONTEXTE

   Le cas vécu : on dit « relance », et l'agent ne sait pas quoi
   relancer — alors que la conversation est là, ouverte, avec tout
   dedans. Ce n'est pas une panne de mémoire. C'est une panne d'ORDRE :
   il est allé chercher loin sans avoir regardé près.

       AVANT DE CHERCHER LOIN, RELIRE PRÈS.

   Face à une demande qui suppose un contexte — « relance »,
   « continue », « comme tout à l'heure », « ça ne marche pas » —
   l'ordre est fixe et ne varie jamais :

     1. le fil visible, celui qu'on a sous les yeux ;
     2. le plan en cours et l'état de ses étapes ;
     3. la dernière séance résumée ;
     4. et seulement alors, demander.

   Et il DIT ce qu'il a relu. Une reprise silencieuse est une devinette
   déguisée : si l'on ne sait pas d'où vient sa réponse, on ne peut pas
   corriger sa méprise.
   ═══════════════════════════════════════════════════════════════════ */
.relu{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);
  background:var(--surface);border-radius:var(--radius-md);padding:10px 14px;
  margin-bottom:14px;animation:rise .3s cubic-bezier(.2,0,0,1) both}
[data-d="epure"] .relu{background:none;padding:10px 0 0;border-top:1px solid rgba(31,31,31,.08)}
.relu b{color:var(--text);font-weight:500}
.relu .st{flex:none;margin-top:2px;color:var(--muted)}


/* ═══════════════════════════════════════════════════════════════════
   REMPLIR user.md SANS VOIR DE MARKDOWN

   Une zone de texte vide devant quelqu'un qui n'a jamais écrit de
   markdown, c'est la page blanche. Les cinq questions deviennent donc
   cinq champs, chacun avec son invite au-dessus et **son exemple en
   filigrane dans le champ**.

       L'EXEMPLE VA DANS LE CHAMP, PAS À CÔTÉ.

   Un exemple posé sous le champ se lit comme une consigne de plus. Le
   même texte en filigrane se lit comme « voilà à quoi ressemblerait
   votre réponse » — et il disparaît dès qu'on tape.

   Le fichier reste consultable d'un lien : rien n'est caché, mais
   personne n'est obligé de le regarder.
   ═══════════════════════════════════════════════════════════════════ */
.qbloc{padding:18px 0;border-bottom:1px solid rgba(31,31,31,.07)}
.qbloc:last-of-type{border-bottom:none}
.qn{font-weight:500;margin-bottom:4px}
.qi{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.qi b{color:var(--text);font-weight:500}
.qf{width:100%;background:var(--surface);border-radius:var(--radius-md);
  padding:12px 15px;font-size:15px;line-height:1.55;border:1px solid transparent;
  resize:vertical;min-height:52px;color:var(--text);font-family:var(--font-ui)}
.qf:focus{outline:none;background:var(--bg);border-color:var(--outline-var)}
.qf::placeholder{color:var(--faint);font-style:italic}
.qrepondu{color:var(--green);font-size:13px;margin-left:8px;font-weight:500}
.qprog{display:flex;align-items:center;gap:14px;margin:4px 0 18px;
  font-size:14px;color:var(--muted)}
.qprog .bar{flex:1;max-width:220px;height:4px;background:var(--surface-hi);
  border-radius:var(--radius-pill);overflow:hidden}
.qprog .bar i{display:block;height:100%;background:var(--green);
  border-radius:var(--radius-pill);transition:width .3s ease}

/* ═══ Repères ═══ */
.fam{margin-bottom:26px}
.fam h3{font-size:var(--font-size-sm);color:var(--muted);font-weight:500;margin-bottom:10px}
.gl-row{display:flex;align-items:center;gap:18px;padding:13px 18px;background:var(--surface);
  border-radius:var(--radius-md);margin-bottom:6px}
.gl-ic{width:40px;height:40px;flex:none;border-radius:var(--radius-sm);background:var(--bg);
  display:grid;place-items:center;color:var(--text)}
.gl-nm{width:150px;flex:none;font-weight:500}
.gl-rule{flex:1;font-size:var(--font-size-sm);color:var(--muted)}
.law{background:var(--accent-container);color:var(--on-accent-container);
  border-radius:var(--radius-md);padding:16px 20px;margin-bottom:22px;font-size:15px}
.law b{font-weight:600}
.dembar{position:fixed;left:0;right:0;bottom:0;z-index:5;height:34px;
  display:flex;align-items:center;gap:10px;padding:0 16px;
  background:rgba(255,255,255,.92);border-top:1px solid var(--outline-var);
  backdrop-filter:blur(8px)}
.dembar .sp{flex:1}
.dembar .note{font-size:var(--font-size-xs);color:var(--faint);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.dembar button{height:24px;padding:0 12px;border-radius:var(--radius-pill);flex:none;
  font-size:12px;color:var(--muted);background:var(--surface);white-space:nowrap;
  transition:background .14s ease,color .14s ease}
.dembar button:hover{background:var(--surface-hi);color:var(--text)}
/* Le contenu s'arrête au-dessus de la barre : elle ne recouvre rien. */
#app,#lvl1,#first{padding-bottom:34px}

/* ═══ Régression de la décision 19, trouvée par l'audit sur images ══
   Le bandeau de dette est entièrement rouge sur les 27 captures du
   lot 4c. À 760 px il occupe trois lignes pleines en haut de l'écran.

     LA COULEUR NE COLORE PAS LE MESSAGE — ELLE DÉSIGNE LE MOT.

   Ce n'est pas neuf : la correction avait été faite une première
   fois, puis **perdue quand le texte a été réécrit** pour le rendre
   plus concret. Une règle qui vit dans une chaîne de caractères se
   perd à la première réécriture de cette chaîne.

   Posé ici, en fin de feuille, volontairement : après quatre passes
   perdues aujourd'hui à raffiner des cascades, on choisit ce qui ne
   peut pas être défait par une règle écrite plus haut.
   ═══════════════════════════════════════════════════════════════ */
.dette,.dette.rouge{color:var(--text)}
.dette .tx{color:var(--text)}
/* Ce qui garde le droit à la couleur : le triangle qui alerte, et le
   mot qui mène quelque part. Deux objets, pas une phrase. */
.dette .pt{color:var(--amber)}
.dette.rouge .pt{color:#B3261E}
.dette .tx b{color:var(--text)}

/* ═══ Rendu markdown (correctif catégorie 3) ════════════════════════
   ⚠ CES RÈGLES SUIVENT LA CLASSE, PLUS L'ENDROIT. Elles étaient écrites
   `.msg .u-md …`, donc elles ne s'appliquaient que dans une bulle du fil.
   Le volet rend le même `.u-md` : ses tableaux étaient sans bordures, ses
   citations sans barre, ses paragraphes sans espacement. Il ne manquait pas
   une règle — il manquait de ne pas être une bulle.
   Ce qui dépend VRAIMENT de l'endroit reste préfixé : `.msg.you` plus bas
   assombrit le fond du code sur la bulle grise de la personne. */
.u-md{line-height:1.65}
.u-md p{margin:0 0 var(--space-3)}
.u-md p:last-child{margin-bottom:0}
.u-md h1,.u-md h2,.u-md h3{margin:.2em 0 .45em;font-weight:700;line-height:1.25}
.u-md h1{font-size:1.3em}
.u-md h2{font-size:1.15em}
.u-md h3{font-size:1.03em;color:var(--muted)}
.u-md ul,.u-md ol{margin:0 0 var(--space-3);padding-left:1.35em}
.u-md li{margin:.18em 0}
.u-md ul.u-md-l,.u-md ol.u-md-l{list-style:inherit}
.u-md code{background:var(--code-bg,rgba(127,127,127,.16));padding:.12em .4em;border-radius:6px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em}
/* Un bloc de code : il DÉFILE plutôt que de pousser la colonne. Une ligne
   de terminal ne se coupe pas, et le volet fait 560 px. */
.u-md pre.u-md-c{margin:0 0 var(--space-3);padding:12px 14px;border-radius:10px;
  background:var(--surface,#F0F4F9);border:1px solid var(--surface-hi,#E9EEF6);
  overflow-x:auto}
/* ═══ L'encart des livrables, à la fin d'un tour ═══════════════════════════
   ⚠ IL DOIT SE VOIR EN FAISANT DÉFILER SANS LIRE, parce que c'est exactement
   comme ça qu'on le cherchera. C'est le SEUL bloc du fil à porter une bordure
   pleine, un liseré d'accent et un fond distinct — demandé par kuchu, qui a
   parcouru une réponse entière sans repérer trois fichiers noyés dedans.
   Le ⤓ au coin d'un bloc de code, lui, a été retiré : deux boutons pour un
   même fichier, c'est ce qu'on enlève partout. */
.l-livrables{margin:14px 0 0;border:1px solid var(--surface-hi,#E9EEF6);
  border-left:3px solid var(--accent,#0B57D0);border-radius:var(--radius-md);
  background:var(--surface,#F0F4F9);overflow:hidden}
.l-titre{display:flex;align-items:center;gap:8px;padding:9px 14px;
  font-size:var(--font-size-xs);font-weight:600;color:var(--text,#1F1F1F);
  border-bottom:1px solid var(--surface-hi,#E9EEF6)}
.l-titre svg{color:var(--accent,#0B57D0);flex:none}
.l-item{display:flex;align-items:center;gap:10px;padding:9px 14px;
  cursor:pointer;transition:background .15s}
.l-item + .l-item{border-top:1px solid rgba(127,127,127,.10)}
.l-item:hover{background:var(--bg,#fff)}
/* Le type, en pastille : « CSV », « MD ». C'est ce que kuchu veut lire à la
   place du contenu déroulé — le nom du fichier et ce que c'est, rien de plus.
   Largeur fixe pour que les noms s'alignent d'une ligne à l'autre. */
.l-type{flex:none;min-width:38px;text-align:center;padding:2px 6px;
  border-radius:5px;background:var(--accent-container,#D3E3FD);
  color:var(--accent,#0B57D0);font-size:10px;font-weight:700;letter-spacing:.4px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.l-nom{font-weight:600;font-size:13px;color:var(--text,#1F1F1F);flex:none;
  max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* D'où vient le fichier : un chemin, ou « dans cette réponse ». La différence
   est réelle — c'est elle qui explique pourquoi l'un s'ouvre et l'autre non. */
.l-ou{font-size:11.5px;color:var(--muted,#5F6368);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;
  text-align:left}
.l-actes{display:flex;align-items:center;gap:4px;flex:none}
.l-ouvrir{font-size:12px;color:var(--accent,#0B57D0);padding:4px 8px;
  border-radius:6px;transition:background .15s}
.l-ouvrir:hover{background:var(--accent-container,#D3E3FD)}
.l-dl{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:14px;color:var(--muted,#5F6368);
  transition:background .15s,color .15s}
.l-dl:hover{background:var(--accent-container,#D3E3FD);color:var(--accent,#0B57D0)}
.l-dl.ok{color:var(--green,#188038)}

/* ═══ Le plan proposé, et le bouton qui le valide ══════════════════════════
   Même famille visuelle que l'encart des livrables — bordure pleine, liseré
   d'accent — parce que c'est la même espèce : quelque chose que la réponse a
   PRODUIT et sur quoi on va agir. Deux dessins différents pour deux encarts
   qui se lisent pareil seraient un dialecte de plus.
   Voir PASSE-DESIGN-UN-SEUL-FIL.md §4. */
.m-plan{margin:14px 0 0;border:1px solid var(--surface-hi,#E9EEF6);
  border-left:3px solid var(--accent,#0B57D0);border-radius:var(--radius-md);
  background:var(--surface,#F0F4F9);overflow:hidden}
.m-etape{display:flex;align-items:flex-start;gap:10px;padding:8px 14px;
  font-size:13px;color:var(--text,#1F1F1F);line-height:1.5}
.m-etape + .m-etape{border-top:1px solid rgba(127,127,127,.10)}
/* Le numéro tient la place d'une puce : le plan est ORDONNÉ, et c'est l'ordre
   qu'on valide autant que le contenu. */
.m-n{flex:none;width:20px;height:20px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:700;
  background:var(--accent-container,#D3E3FD);color:var(--accent,#0B57D0);
  margin-top:1px}
/* Une étape faite se barre. Elle reste lisible — on veut voir le chemin
   parcouru, pas seulement ce qui reste. */
.m-etape.completed{color:var(--muted,#5F6368)}
.m-etape.completed span:last-child{text-decoration:line-through}
.m-etape.completed .m-n{background:var(--green,#188038);color:#fff}
.m-etape.in_progress .m-n{background:var(--accent,#0B57D0);color:#fff}
.m-etape.cancelled{color:var(--muted,#5F6368);opacity:.6}
.m-pied{padding:10px 14px;border-top:1px solid var(--surface-hi,#E9EEF6);
  display:flex;justify-content:flex-end}
/* LE seul bouton plein du fil. Il déclenche l'écriture sur le disque : il a le
   droit de se voir, et il doit être le seul à ce niveau de contraste. */
.m-bascule{padding:9px 18px;border-radius:var(--radius-pill);
  background:var(--accent,#0B57D0);color:#fff;font-size:14px;font-weight:600;
  transition:filter .15s}
.m-bascule:hover{filter:brightness(1.08)}
.m-bascule:disabled{opacity:.55}

/* Le refus de mode : un geste qui n'a PAS eu lieu. En ambre, comme la coupe —
   ce n'est pas une panne, c'est une limite, et elle a une sortie. */
.msg.m-refus{border-left:3px solid var(--amber,#E37400);
  background:rgba(227,116,0,.06);padding-left:11px;border-radius:8px}
.u-md pre.u-md-c code{background:none;padding:0;border-radius:0;font-size:.88em;
  line-height:1.55;white-space:pre;display:block}
.u-md blockquote{margin:0 0 var(--space-3);padding:.2em .9em;border-left:3px solid var(--accent,#7c5cff);
  color:var(--muted);background:rgba(127,127,127,.06)}
.u-md blockquote > :last-child{margin-bottom:0}
.u-md hr{border:none;border-top:1px solid var(--line,#e2e2ea);margin:var(--space-4) 0}
/* Un tableau large déborde du volet : c'est LUI qui défile, pas la page. */
.u-md table.u-md-t{border-collapse:collapse;width:100%;margin:.2em 0 var(--space-3);
  font-size:.92em;overflow:hidden;border-radius:10px}
.u-md table.u-md-t th,.u-md table.u-md-t td{border:1px solid var(--line,#e2e2ea);
  padding:6px 10px;text-align:left;vertical-align:top}
.u-md table.u-md-t th{background:var(--th-bg,rgba(127,127,127,.12));font-weight:600}
.u-md table.u-md-t tr:nth-child(even) td{background:rgba(127,127,127,.04)}
.msg.you .u-md code{background:rgba(0,0,0,.08)}
.msg.you .u-md table.u-md-t th{background:rgba(0,0,0,.07)}
.msg.you .u-md table.u-md-t tr:nth-child(even) td{background:rgba(0,0,0,.03)}
.msg .u-md[data-caret="1"]::after{content:"▍";display:inline-block;animation:u-blink 1s steps(1) infinite}
@keyframes u-blink{50%{opacity:0}}

/* ⚠ `.u-coupe` A ÉTÉ RETIRÉE ICI, ET C'EST UN PIÈGE DÉSAMORCÉ.
   Elle habillait en ambre l'avis de troncature au plafond de tokens — un avis
   supprimé avec le mode pur (voir `turnHTML`, ulysse-app.js) : plus AUCUN
   markup ne portait cette classe, la règle survivait seule.
   Le 2026-08-12, une note neuve — « Interrompu par votre correction » — a été
   écrite avec ce nom resté libre. Elle s'est habillée toute seule en ambre à
   liseré et a hérité d'un sens qui n'était pas le sien : « limite du modèle »
   au lieu de « c'est vous qui l'avez coupé ». Vu à l'écran, jamais au banc.
   Une règle orpheline n'est pas du poids mort : c'est une embuscade pour le
   prochain qui choisira un nom. Elle est donc partie avec son markup.
   La note vit maintenant sous `.u-interrompu`. */

/* ===== La carte d'un fichier, dans le fil =====
   Dans le fil, une carte est une MENTION — pas un panneau de commandes. Une
   seule action : Ouvrir. Source, copie et téléchargement sont dans le volet.
   La deuxième ligne dit OÙ IL EST, tronqué PAR LA TÊTE : la fin d'un chemin
   dit où l'on est, le début dit ce qu'on savait déjà. */
.f-carte{display:inline-flex;align-items:center;gap:12px;padding:11px 14px;margin:6px 0;
  border:1px solid var(--surface-hi,#E9EEF6);border-radius:12px;background:var(--bg,#fff);
  cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .15s ease;
  box-shadow:var(--elev-1,0 1px 2px rgba(0,0,0,.05));max-width:380px}
.f-carte:hover{background:var(--surface,#F0F4F9);border-color:var(--accent,#0B57D0);transform:translateY(-1px)}
.f-carte:focus{outline:2px solid var(--accent,#0B57D0);outline-offset:2px}
.f-ic{flex:0 0 auto;width:34px;height:34px;border-radius:9px;
  background:var(--accent-container,#D3E3FD);color:var(--accent,#0B57D0);
  display:flex;align-items:center;justify-content:center}
.f-ic svg{width:18px;height:18px}
.f-txt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.f-nom{font-weight:600;font-size:13.5px;color:var(--text,#1F1F1F);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.f-ou{font-size:11.5px;color:var(--muted,#5F6368);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.f-go{margin-left:auto;color:var(--accent,#0B57D0);font-size:12px;opacity:.75;padding-left:6px}
/* Le fichier n'est pas là. On le dit AVANT le clic : une carte qui promet un
   fichier absent est un bouton mort. En ambre — ce n'est pas une panne. */
.f-carte.absent{cursor:default;border-style:dashed;box-shadow:none;
  border-color:var(--amber,#E37400);background:var(--bg,#fff)}
.f-carte.absent:hover{transform:none;background:var(--bg,#fff);border-color:var(--amber,#E37400)}
.f-carte.absent .f-ic{background:rgba(227,116,0,.14);color:var(--amber,#E37400)}
.f-carte.absent .f-ou{color:var(--amber,#E37400)}

/* Volet EN FLUX (vrai split responsive : le chat reste visible à gauche).
   Insere apres .work dans #app ; en flex, .work (flex:1) retrecit et le
   volet prend sa largeur. Pas de backdrop masquant — et plus de script qui
   en fabriquait un pendant que cette ligne écrivait le contraire.

   ⚠ `.u-art-head` et `.u-art-body` sont des enfants DIRECTS d'ici. Ils ont
   longtemps été enveloppés dans un `<aside class="u-art-panel">` qui n'avait
   AUCUNE règle : `.u-art-body{flex:1}` ne s'appliquait donc à rien, la
   hauteur du corps restait libre, et `overflow:hidden` coupait. Un document
   de six écrans était tronqué SANS barre de défilement — et toutes les passes
   de design en font six. L'enveloppe n'a pas reçu de règles : elle a été
   retirée. C'est ce volet qui EST l'aside. */
.u-art-viewer{display:none;flex:none;width:0;min-height:0;
  border-left:1px solid var(--surface-hi,#E9EEF6);
  background:var(--bg,#fff);

  transition:width .2s cubic-bezier(.2,0,1)}

.u-art-head{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--surface-hi,#E9EEF6);flex:none}
.u-art-vic{color:var(--accent,#0B57D0);display:flex}
.u-art-vic svg{width:16px;height:16px}
.u-art-vname{font-size:13px;font-weight:600;color:var(--text,#1F1F1F);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-art-vspacer{flex:1}
/* Le fil d'Ariane, plutôt qu'une croix seule : l'Établi et le volet sont le
   même volet à deux moments — parcourir, puis regarder. On est allé quelque
   part, on doit pouvoir revenir sans refermer. */
.f-fil{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.f-ici{font-size:12px;color:var(--muted,#5F6368);white-space:nowrap;
  border-radius:6px;padding:2px 6px;transition:background .15s,color .15s;
  overflow:hidden;text-overflow:ellipsis;max-width:180px}
.f-ici:hover{background:var(--surface,#F0F4F9);color:var(--accent,#0B57D0)}
.f-sep{color:var(--muted,#5F6368);font-size:12px;flex:none}
.f-outils{display:flex;align-items:center;gap:2px;flex:none}
.u-art-btn{width:30px;height:30px;border-radius:7px;color:var(--muted,#5F6368);
  display:flex;align-items:center;justify-content:center;font-size:14px;transition:background .15s}
.u-art-btn:hover{background:var(--surface,#F0F4F9);color:var(--text,#1F1F1F)}
.u-art-btn.on{background:var(--accent-container,#D3E3FD);color:var(--accent,#0B57D0)}
.u-art-btn.ok{color:var(--green,#188038)}
/* Un bouton qui ne peut rien faire se désactive plutôt que de mentir : pas de
   source pour une image, pas de copie pour du binaire. */
.u-art-btn:disabled,.u-art-btn[aria-disabled="true"]{opacity:.35;pointer-events:none}
/* `min-height:0` est ce qui autorise un enfant flex à devenir plus PETIT que
   son contenu — sans lui, le corps pousse et la barre de défilement n'arrive
   jamais. C'est la seconde moitié du défaut ci-dessus. */
.u-art-body{flex:1;min-height:0;overflow-y:auto;padding:24px 30px;background:var(--bg,#fff)}
.u-art-empty{color:var(--muted,#5F6368);font-size:14px;text-align:center;margin-top:40px}
.u-art-raw{font-family:var(--font-mono,ui-monospace,Menlo,monospace);font-size:12.5px;
  white-space:pre-wrap;color:var(--text,#1F1F1F);line-height:1.6;background:var(--surface,#F0F4F9);
  border-radius:10px;padding:14px}
/* reutilise .u-md pour le rendu markdown (tableaux, listes, gras) */
.u-art-body .u-md{padding:0}
/* Un CSV se lit en colonnes ou ne se lit pas. Le tableau defile TOUT SEUL en
   largeur : sans ce conteneur, huit colonnes poussent le volet et c'est la
   page entiere qui part de travers. L'en-tete tient au haut du volet — on
   perd la colonne des yeux au bout de vingt lignes, sinon. */
.u-art-tabwrap{overflow-x:auto;border:1px solid var(--outline-var,#E1E3E1);

@media (max-width:860px){

}

<!-- ═══════════════════════════════════════════════════════════════════════
     LA PROPOSITION. Débranchée par défaut (media="not all").
     ═══════════════════════════════════════════════════════════════════════ -->
<style id="propose" media="not all">

/* ── 1. LES DEUX BANDEAUX DE VOLET DISPARAISSENT ─────────────────────────
   La maquette n'avait aucun `.volet-head` dans le Plan. Le produit en a
   ajouté deux — « Ce que fait l'agent » et « Le détail » — juste sous un
   segment qui dit déjà « Schéma · Les deux · Détail ».

   Deux titres de 46 px pour renommer ce que le bouton juste au-dessus vient
   de nommer : 92 px de hauteur perdus sur le seul écran du produit qui a
   vraiment besoin de place. */
#pPlan .volet-head{display:none}

/* ── 2. LE SCHÉMA CESSE D'ÊTRE UN RUBAN ──────────────────────────────────
   C'est le vrai défaut de cet écran, et il ne se voit qu'avec de vraies
   données. Le layout de la maquette range par couches — il était fait pour
   un plan qui BRANCHE, avec des étapes parallèles. Or les étapes réelles
   sont une chaîne : `edges = steps.slice(1).map(s => [s.n-1, s.n])`.
   Une chaîne rangée par couches donne une couche par étape, donc UNE SEULE
   LIGNE. À dix outils, le schéma fait 2300 px de large pour 74 de haut : un
   ruban qu'on lit à la loupe, dans un cadre presque carré.

   Le correctif n'est pas du CSS, c'est le rangement : replier la chaîne en
   serpentin, rangée par rangée, comme un texte. On garde la lecture dans
   l'ordre — gauche à droite, puis la ligne suivante — et le schéma remplit
   son cadre au lieu de le traverser.

   (Basculez sur « Proposé » avec 12 étapes pour voir la différence : c'est
   la même donnée, le même moteur, un autre rangement.)

   Ce bloc-ci ne fait que le décor ; le rangement lui-même est en JS plus
   bas, dans serpentin(). */
#pPlan .canvas-body{padding:0}

/* ── 2 bis. LE VOLET DEVIENT UNE CARTE ───────────────────────────────────
   Aujourd'hui le SVG se dimensionne par son contenu : le moteur pose un
   `aspect-ratio` en style inline, et `svg.graph{width:100%;height:auto}`
   suit. Sur un contenu très large — le ruban ci-dessus — la carte déborde
   son volet et se fait couper des deux côtés. On voit une étape et demie
   sur douze, sans rien pour dire qu'il y en a d'autres.

   Le volet devient donc un CADRE, et le schéma une carte à l'intérieur :
   le SVG remplit le volet, `preserveAspectRatio` fait tenir le contenu
   dedans, et plus rien ne dépasse jamais. Le zoom et le déplacement
   existaient déjà dans le moteur (molette autour du pointeur, tirer pour
   déplacer) — ils n'étaient simplement pas trouvables.

   Ce qui les rend trouvables : un fond qui dit « ceci est un canevas », un
   curseur qui change, et une petite barre qui donne l'échelle. Un geste
   qu'on ne devine pas n'existe pas. */
#pPlan svg.graph{width:100%!important;height:100%!important;max-height:none!important;
  aspect-ratio:auto!important;display:block}
#pPlan .canvas-body{position:relative;display:block;overflow:hidden;
  border-radius:var(--radius-card);
  background-image:radial-gradient(var(--outline-var) .9px,transparent .9px);
  background-size:22px 22px;background-position:-1px -1px}

/* Les cartes prennent leur couleur (le remplissage est posé en JS, voir
   colorier()). Le voile des terminées devient inutile : il s'ajoutait au
   remplissage et rendait le fini plus dense que ce qui travaille — l'inverse
   de ce qu'on veut. */
#pPlan .node .tint{display:none}
/* Le liseré peut alors s'alléger : la couleur est déjà dans la carte, il n'a
   plus à la porter seul. */
#pPlan .node .b{stroke-width:1.3}
#pPlan .node.st-run .b{stroke-width:2}
#pPlan .node:hover .b{filter:brightness(.97)}

/* Une carte qu'on peut prendre le dit par son curseur, et le confirme en se
   décollant du fond pendant qu'on la tient. */
#pPlan svg.graph g.node{cursor:grab}
#pPlan svg.graph.p-prise,
#pPlan svg.graph.p-prise g.node{cursor:grabbing}
#pPlan svg.graph.p-prise g.node.sel .b{filter:brightness(1.02)}
#pPlan svg.graph.p-prise g.node.sel{filter:drop-shadow(0 3px 8px rgba(0,0,0,.22))}

/* La barre d'échelle. En bas à droite, avec « Recentrer » qui s'y range :
   trois commandes de la même famille au même endroit, plutôt qu'un bouton
   isolé qui apparaît et disparaît. */
#pPlan .p-cam{position:absolute;right:var(--space-4);bottom:var(--space-3);z-index:4;
  display:flex;align-items:center;gap:2px;background:var(--bg);
  border:1px solid var(--outline-var);border-radius:var(--radius-pill);
  padding:3px;box-shadow:var(--elev-1)}
#pPlan .p-cam button{width:28px;height:28px;border-radius:50%;display:grid;
  place-items:center;color:var(--muted);font-size:15px;line-height:1}
#pPlan .p-cam button:hover{background:var(--hover-bg);color:var(--text)}
#pPlan .p-cam .k{min-width:44px;text-align:center;font-size:11.5px;
  color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer}
#pPlan .p-cam .k:hover{color:var(--text)}
#pPlan .p-cam .p-sep{width:1px;height:18px;background:var(--outline-var);margin:0 3px}
/* Ranger automatiquement n'est pas un réglage de vue comme les autres : il
   remet de l'ordre. Il se distingue donc des deux loupes — sans crier. */
#pPlan .p-cam .auto{color:var(--accent)}
#pPlan .p-cam .auto:hover{background:var(--accent-container);
  color:var(--on-accent-container)}
#pPlan .p-cam .auto svg{width:17px;height:17px}
/* Quand la caméra n'est plus à plat, le bouton le dit : c'est là qu'il sert. */
#pPlan .p-cam.deplace .auto{background:var(--accent-container);
  color:var(--on-accent-container)}
/* « Recentrer » quitte son coin : il est maintenant le clic sur l'échelle. */
#pPlan #recentrer{display:none!important}
#pPlan .glegend{right:190px}

/* ── 3. L'ÉTAT VIDE ARRÊTE DE FAIRE PEUR ─────────────────────────────────
   Aujourd'hui l'écran vide affiche « Rien encore », puis un encadré en
   pointillés qui parle de `display.tool_progress` et du RPC `config.set`.
   La réserve est juste — sans ce réglage, rien n'apparaîtra jamais — mais
   elle s'adresse à quelqu'un qui débogue, pas à quelqu'un qui attend.

   Elle passe donc en seconde ligne : une phrase, et le détail technique
   derrière un lien. Ce qui reste au premier plan, c'est ce qui va se
   passer. */
#pPlan .u-todo{border:none;padding:0;margin:14px 0 0;max-width:460px;
  font-size:var(--font-size-xs);color:var(--faint)}
#pPlan .u-todo .p-repli{display:none}
#pPlan .u-todo.on .p-repli{display:block;margin-top:8px;line-height:1.6}
#pPlan .u-todo .p-lien{color:var(--accent);cursor:pointer}
#pPlan .empty{padding:0}
#pPlan .p-vide{display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:100%;text-align:center;padding:24px}

/* ── 3 bis. CHAQUE ÉTAPE DU DÉTAIL RETROUVE SON KEBAB ────────────────────
   Ce n'est pas une invention : `.dots` et `.sactions` sont dans ulysse.css
   depuis la maquette, avec ce commentaire —

     « Le kebab reste visible. Il l'était au survol seulement, et c'est la
       troisième fois que Raf ne le trouve pas. Une commande qu'il faut
       découvrir pour s'en servir n'est pas discrète, elle est cachée. »

   Le produit n'a repris ni l'un ni l'autre : les étapes n'ont plus aucune
   action. On les remet, avec la même règle — le kebab est VISIBLE, en gris,
   pas au survol. Les actions s'ouvrent sous l'étape (`.exp-acts`) au lieu
   d'un menu flottant : elles appartiennent à la ligne, elles ne survolent
   pas la liste.

   Le double-clic sur une étape ouvre sa fiche — le même geste que le ⋯ du
   nœud dans le schéma, pour que les deux volets se répondent. */
#pPlan .exp-h .dots{margin-left:2px}
#pPlan .sactions{padding-left:26px;padding-bottom:14px}
#pPlan .exp.exp-acts{background:var(--sidebar);border-radius:var(--radius-md)}
#pPlan .exp.exp-acts .exp-h{padding-left:10px;padding-right:6px}
#pPlan .exp.exp-acts .sactions{padding-left:36px}
/* Une action qui change un réglage durable ne se confond pas avec une
   action ponctuelle : elle porte l'accent, pas le contour gris. */
#pPlan .sactions button.regle{border-color:var(--accent-container);
  background:var(--accent-container);color:var(--on-accent-container)}
#pPlan .sactions button.regle:hover{background:#BFD8FB}

/* ── 4. LE PIED DU DÉTAIL DIT CE QU'IL MONTRE ────────────────────────────
   « Voir le flux brut » ouvre un journal de 38 vh sous les étapes, sans
   qu'on sache combien de lignes arrivent ni si ça bouge encore. On lui
   ajoute son compte — c'est ce qui distingue un miroir d'un résumé. */
#pPlan .reader-foot .p-cpt{color:var(--faint);font-size:var(--font-size-xs);
  margin-left:6px}
#pPlan .u-jrn{border-top:1px solid var(--outline-var);margin-top:14px;
  padding-top:10px}
</style>
</head>

<script>
/* ══ ulysse-view.js, recopié ══ */
/* ============================================================================
 * ulysse-view.js — la machinerie de rendu de la maquette, rendue GÉNÉRIQUE
 * ----------------------------------------------------------------------------
 * La maquette est scriptée : son schéma dessine six étapes écrites en dur
 * (STEPS/EDGES), son Vestiaire douze agents inventés (AGENTS), ses
 * Automatisations trois tâches fictives (AUTOS), sa cloche trois notifications
 * de démonstration (NOTIFS). Copier ces tableaux aurait donné une maquette qui
 * ment, pas un produit.
 *
 * Ce fichier reprend donc le RENDU — la géométrie du schéma, les coudes, la
 * caméra, la cloche, les bulles, les feuilles, les rangées de réglages, la
 * fenêtre du terminal — et en retire les données. Chaque moteur reçoit ce
 * qu'il doit dessiner ; il ne sait pas d'où ça vient.
 *
 * Ce qui est repris tel quel (c'est du dessin, pas de la donnée) :
 *   · layout()      — rangement par couches, la profondeur = plus longue chaîne
 *   · coudeAxe()    — les liens orthogonaux à coudes arrondis
 *   · deuxLignes()  — deux lignes maximum dans une carte
 *   · la caméra     — on tire pour déplacer, on roule pour zoomer, autour du
 *                     pointeur ; seuil de 4 px pour distinguer tirer de cliquer
 *   · NKIND, le vocabulaire visuel des notifications
 *
 * Ce qui a été RETIRÉ, et pourquoi :
 *   · REM / TOG     — la maquette laisse retirer une étape du plan. Hermès
 *                     n'a pas d'API pour éditer le plan d'un agent ; un
 *                     bouton qui ne fait rien est pire qu'un bouton absent.
 *   · DRY           — l'essai à blanc suppose un plan connu d'avance. L'agent
 *                     n'en produit pas : il agit, et on le regarde agir.
 *
 * UNE ADAPTATION NÉCESSAIRE : la maquette interpole ses données directement
 * dans du `innerHTML`. Elle le peut : ses données, c'est elle qui les écrit.
 * Ici elles viennent du backend et du WebSocket — un titre de session
 * contenant `<img onerror=…>` s'exécuterait dans la page, avec accès au proxy
 * authentifié. Tout ce qui vient de l'extérieur passe donc par esc().
 * ========================================================================== */
"use strict";

/* ═══ Échappement — la seule chose ajoutée au rendu ═══════════════════════ */

function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* ═══ Le bandeau du bas (snack) ═══════════════════════════════════════════
   Repris verbatim. Une action annulable le dit sur place, et pendant six
   secondes — pas dans une boîte qu'il faut acquitter. */

let snackT = null, undoFn = null;

function snack(msg, undo){
  const el = document.getElementById("snack");
  if (!el) return;
  undoFn = undo || null;
  el.innerHTML = "<span>" + esc(msg) + "</span>"
    + (undo ? '<button id="snack-undo">Annuler</button>' : "");
  if (undo) el.querySelector("#snack-undo").onclick = doUndo;
  el.classList.add("on");
  clearTimeout(snackT);
  snackT = setTimeout(() => el.classList.remove("on"), 6000);
}

function doUndo(){
  if (undoFn) undoFn();
  undoFn = null;
  const el = document.getElementById("snack");
  if (el) el.classList.remove("on");
  clearTimeout(snackT);
}

/* ═══ Les feuilles (sheets) ═══════════════════════════════════════════════ */

function openS(id, html){
  const bg = document.getElementById(id);
  if (!bg) return;
  const body = bg.querySelector(".sheet");
  if (body && html !== undefined) body.innerHTML = html;
  bg.classList.add("on");
}
function closeS(id){
  const el = document.getElementById(id);
  if (el) el.classList.remove("on");
}

/* ═══════════════════════════════════════════════════════════════════════════
   LE SCHÉMA
   ---------------------------------------------------------------------------
   Décision D1 de la maquette, conservée : le schéma dit OÙ ON EN EST et QUI
   TRAVAILLE ; la liste, à droite, dit ce qu'il y a dedans. Deux registres,
   pas deux vues.

   Quatre choses le gouvernent, et elles sont reprises :
     · une COULEUR par équipe, portée à l'identique par le liseré, le nom et
       le flux du lien qui en sort — la couleur n'est pas décorative, c'est
       le seul endroit qui dit qui fait ;
     · des liens ORTHOGONAUX à coudes arrondis, qu'on suit du doigt ;
     · le néon ne s'allume que sur ce qui travaille ;
     · le mouvement ne ment pas : un lien ne coule que si son amont est fini
       ET son aval en cours.

   Ce qui change par rapport à la maquette : les étapes ne sont plus écrites
   d'avance. Elles sont fournies par l'appelant — chez nous, la suite réelle
   des outils appelés par l'agent.
   ═══════════════════════════════════════════════════════════════════════════ */

const NW = 168, NH = 74, RX = 14, NEUTRE = "#9AA0A6";

function Graph(svgId){
  const G = {
    steps: [],        // [{n, t, pct, team, auto}]
    edges: [],        // [[a, b]]
    teams: {},        // {clef: {n:"NOM COURT", c:"#hex"}}
    POS: {},
    VUE: { w: 920, h: 380 },
    CAM: { x: 0, y: 0, k: 1 },
    sel: null,
    onPick: null,     // (n) => void
    onFiche: null     // (n) => void
  };

  const byN = (n) => G.steps.find((s) => s.n === n);
  const coul = (n) => {
    const s = byN(n);
    return (s && s.team && G.teams[s.team]) ? G.teams[s.team].c : NEUTRE;
  };

  function etat(s){
    if (s.pct >= 100) return "done";
    if (s.pct > 0)    return "run";
    return "wait";
  }

  /* Rangement par couches : la profondeur d'une étape est la plus longue
     chaîne qui y mène. Repris verbatim, sans la sortie de flux des étapes
     retirées (elles n'existent plus). */
  function layout(){
    const L = {};
    G.steps.forEach((s) => { L[s.n] = 0; });
    for (let i = 0; i < G.steps.length; i++){
      G.edges.forEach(([a, b]) => { if (L[b] < L[a] + 1) L[b] = L[a] + 1; });
    }
    const cols = {};
    G.steps.forEach((s) => { (cols[L[s.n]] = cols[L[s.n]] || []).push(s.n); });
    const ks = Object.keys(cols).map(Number).sort((a, b) => a - b);
    const t = {};
    const large = Math.max(1, ...ks.map((k) => cols[k].length));
    const M = 22, PAS = NW + 62, GY = NH + 38;

    const W = M * 2 + ks.length * NW + (ks.length - 1) * (PAS - NW);
    const H = M * 2 + large * GY - (GY - NH);
    const axe = M + (large * GY - (GY - NH)) / 2;
    ks.forEach((k, ci) => {
      const arr = cols[k].sort((x, y) => x - y), h = (arr.length - 1) * GY;
      arr.forEach((n, i) => { t[n] = { x: M + ci * PAS, y: axe - h / 2 - NH / 2 + i * GY }; });
    });
    G.VUE = { w: Math.max(W, 120), h: Math.max(H, 120) };
    return t;
  }

  /* Le coude. Trois segments — sortir dans l'axe, traverser à mi-chemin,
     entrer dans l'axe — avec deux angles arrondis. Aligné, c'est une droite. */
  function coudeAxe(u1, v1, u2, v2, r){
    if (Math.abs(v2 - v1) < 2) return "M" + u1 + " " + v1 + " L" + u2 + " " + v1;
    const mu = (u1 + u2) / 2, dv = v2 > v1 ? 1 : -1;
    const rr = Math.min(r, Math.abs(v2 - v1) / 2, Math.abs(mu - u1), Math.abs(u2 - mu));
    return "M" + u1 + " " + v1
      + " L" + (mu - rr) + " " + v1
      + " Q" + mu + " " + v1 + " " + mu + " " + (v1 + rr * dv)
      + " L" + mu + " " + (v2 - rr * dv)
      + " Q" + mu + " " + v2 + " " + (mu + rr) + " " + v2
      + " L" + u2 + " " + v2;
  }

  /* Deux lignes maximum. Au-delà, la liste est là pour ça. */
  function deuxLignes(t, max){
    const w = String(t || "").split(" "), l = ["", ""];
    let k = 0;
    for (const m of w){
      if ((l[k] + " " + m).trim().length <= max || !l[k]) l[k] = (l[k] + " " + m).trim();
      else if (k === 0){ k = 1; l[1] = m; }
      else { l[1] = l[1].slice(0, max - 1) + "…"; break; }
    }
    return l;
  }

  /* La caméra. Le schéma ne bouge pas : c'est le regard qui se déplace. Tout
     le dessin vit dans un seul groupe transformé, donc déplacer ou zoomer ne
     redessine rien — on écrit un attribut. */
  function camApply(){
    const g = document.getElementById("gzoom");
    if (g) g.setAttribute("transform",
      "translate(" + G.CAM.x + " " + G.CAM.y + ") scale(" + G.CAM.k + ")");
    const b = document.getElementById("recentrer");
    if (b) b.classList.toggle("hidden", G.CAM.k === 1 && G.CAM.x === 0 && G.CAM.y === 0);
  }
  function camReset(){ G.CAM.x = 0; G.CAM.y = 0; G.CAM.k = 1; camApply(); }

  function draw(){
    const el = document.getElementById(svgId);
    if (!el) return;
    if (!G.steps.length){ el.innerHTML = ""; return; }
    if (G.POS[G.steps[0].n] === undefined) Object.assign(G.POS, layout());

    el.setAttribute("viewBox", "-12 -12 " + (G.VUE.w + 24) + " " + (G.VUE.h + 24));
    el.style.aspectRatio = (G.VUE.w + 24) + " / " + (G.VUE.h + 24);
    const p = [];

    /* Les liens d'abord : ils passent derrière les cartes. */
    G.edges.forEach(([a, b]) => {
      const A = G.POS[a], B = G.POS[b];
      if (!A || !B) return;
      const d = coudeAxe(A.x + NW, A.y + NH / 2, B.x, B.y + NH / 2, 14);
      const hot = G.sel !== null && (a === G.sel || b === G.sel);
      const sa = byN(a), sb = byN(b);
      const flow = sa && sb && etat(sa) === "done" && etat(sb) === "run";
      const c = coul(a);
      if (flow){
        /* Trois couches pour un lien qui coule : le halo, les tirets qui
           défilent, et un point qui parcourt réellement le tracé. Le point est
           ce qui fait la différence — des tirets disent « ça bouge », un point
           qui avance dit « ceci est en train d'être porté de là à là ». */
        const pid = "fl" + a + "_" + b;
        p.push('<path id="' + pid + '" class="edgeglow" stroke="' + c + '" d="' + d + '"/>');
        p.push('<path class="edge flow" stroke="' + c + '" d="' + d + '"/>');
        p.push('<circle class="pkh" r="7" fill="' + c + '"><animateMotion dur="2.1s"'
          + ' repeatCount="indefinite" calcMode="linear" keyPoints="0;1" keyTimes="0;1">'
          + '<mpath href="#' + pid + '"/></animateMotion></circle>');
        p.push('<circle class="pk" r="3.2" fill="' + c + '"><animateMotion dur="2.1s"'
          + ' repeatCount="indefinite" calcMode="linear" keyPoints="0;1" keyTimes="0;1">'
          + '<mpath href="#' + pid + '"/></animateMotion></circle>');
      } else {
        p.push('<path class="edge' + (hot ? " hot" : "") + '" d="' + d + '"/>');
      }
    });

    G.steps.forEach((s) => {
      const P = G.POS[s.n];
      if (!P) return;
      const e = etat(s), c = coul(s.n);
      const eq = s.team && G.teams[s.team] ? G.teams[s.team] : null;
      const parts = deuxLignes(s.t, 22);
      const l1 = esc(parts[0]), l2 = esc(parts[1]);
      const bar = NW - 28;
      p.push('<g class="node st-' + e + (G.sel === s.n ? " sel" : "") + '" data-n="' + s.n + '">'
        + '<rect class="glow" x="' + P.x + '" y="' + P.y + '" width="' + NW + '" height="' + NH
          + '" rx="' + RX + '" stroke="' + c + '"/>'
        + '<rect class="b" x="' + P.x + '" y="' + P.y + '" width="' + NW + '" height="' + NH
          + '" rx="' + RX + '" stroke="' + c + '"/>'
        + (e === "done" ? '<rect class="tint" x="' + P.x + '" y="' + P.y + '" width="' + NW
            + '" height="' + NH + '" rx="' + RX + '" fill="' + c + '"/>' : "")
        + '<text class="ti" x="' + (P.x + 14) + '" y="' + (P.y + 25) + '">' + l1 + '</text>'
        + (l2 ? '<text class="ti" x="' + (P.x + 14) + '" y="' + (P.y + 41) + '">' + l2 + '</text>' : "")
        + (eq
            ? '<text class="eq" x="' + (P.x + 14) + '" y="' + (P.y + (l2 ? 59 : 47))
              + '" fill="' + c + '">' + esc(eq.n) + '</text>'
            : '<text class="au" x="' + (P.x + 14) + '" y="' + (P.y + (l2 ? 59 : 47))
              + '">SE FAIT TOUT SEUL</text>')
        + (e === "run"
            ? '<rect class="track" x="' + (P.x + 14) + '" y="' + (P.y + NH - 11) + '" width="'
              + bar + '" height="3.5" rx="2"/>'
              + '<rect class="fill" x="' + (P.x + 14) + '" y="' + (P.y + NH - 11) + '" width="'
              + (bar * s.pct / 100) + '" height="3.5" rx="2" fill="' + c + '"/>'
            : "")
        + (e === "done"
            ? '<path class="ok" d="M' + (P.x + NW - 30) + " " + (P.y + NH - 19)
              + 'l4.5 4.5 8-8" stroke="' + c + '" stroke-width="2.4" fill="none"'
              + ' stroke-linecap="round" stroke-linejoin="round"/>'
            : "")
        + '<g class="nact" transform="translate(' + (P.x + NW - 8) + " " + (P.y + 8) + ')">'
        + '<circle class="nact-bg" r="12"/><circle cx="-4.6" cy="0" r="1.5"/>'
        + '<circle cx="0" cy="0" r="1.5"/><circle cx="4.6" cy="0" r="1.5"/>'
        + "<title>Tout savoir de cette étape</title></g>"
        + "</g>");
    });

    el.innerHTML = '<g id="gzoom" transform="translate(' + G.CAM.x + " " + G.CAM.y
      + ") scale(" + G.CAM.k + ')">' + p.join("") + "</g>";
  }

  function animateTo(target, ms){
    ms = ms || 460;
    const from = {};
    G.steps.forEach((s) => { from[s.n] = { x: G.POS[s.n].x, y: G.POS[s.n].y }; });
    const t0 = performance.now();
    (function frame(t){
      const k = Math.min(1, (t - t0) / ms);
      const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      G.steps.forEach((s) => {
        const n = s.n;
        if (!target[n] || !from[n]) return;
        G.POS[n] = { x: from[n].x + (target[n].x - from[n].x) * e,
                     y: from[n].y + (target[n].y - from[n].y) * e };
      });
      draw();
      if (k < 1) requestAnimationFrame(frame);
    })(t0);
  }

  /* Nouvelles données : on relaie doucement plutôt que de tout sauter en
     place — une carte qui se téléporte fait perdre le fil de ce qu'on suivait. */
  function setData(steps, edges, teams){
    const nouveau = steps.some((s) => G.POS[s.n] === undefined)
      || G.steps.length !== steps.length;
    G.steps = steps;
    G.edges = edges || [];
    G.teams = teams || {};
    const t = layout();
    if (nouveau){ Object.assign(G.POS, t); draw(); }
    else animateTo(t, 240);
  }

  /* Deux gestes seulement, et aucun bouton : on tire pour déplacer, on roule
     pour zoomer, AUTOUR DU POINTEUR. Un zoom centré sur la fenêtre fait fuir
     ce qu'on regardait. Un seuil de quatre pixels sépare le déplacement du
     clic : sans lui, toute tentative de tirer ouvrirait une fiche. */
  function init(){
    const el = document.getElementById(svgId);
    if (!el) return;
    let pan = null, bouge = false;

    el.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      pan = { x: e.clientX, y: e.clientY, cx: G.CAM.x, cy: G.CAM.y };
      bouge = false;
      e.preventDefault();
    });
    window.addEventListener("mousemove", (e) => {
      if (!pan) return;
      const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
      if (!bouge && Math.abs(dx) + Math.abs(dy) < 4) return;
      bouge = true;
      el.classList.add("pan");
      // Le pointeur bouge en pixels, le dessin vit en unités de viewBox : sans
      // ce rapport, le schéma glisse plus vite que la main et le geste colle.
      const r = el.getBoundingClientRect();
      if (!r.width) return;
      const u = (G.VUE.w + 24) / r.width;
      G.CAM.x = pan.cx + dx * u;
      G.CAM.y = pan.cy + dy * u;
      camApply();
    });
    window.addEventListener("mouseup", () => { pan = null; el.classList.remove("pan"); });

    el.addEventListener("wheel", (e) => {
      e.preventDefault();
      const r = el.getBoundingClientRect();
      if (!r.width) return;
      const u = (G.VUE.w + 24) / r.width;
      const px = (e.clientX - r.left) * u - 12, py = (e.clientY - r.top) * u - 12;
      const k2 = Math.min(3, Math.max(0.45, G.CAM.k * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
      G.CAM.x = px - (px - G.CAM.x) * (k2 / G.CAM.k);
      G.CAM.y = py - (py - G.CAM.y) * (k2 / G.CAM.k);
      G.CAM.k = k2;
      camApply();
    }, { passive: false });

    el.addEventListener("dblclick", (e) => { if (!e.target.closest("g.node")) camReset(); });

    el.addEventListener("click", (e) => {
      if (bouge){ bouge = false; return; }   // on tirait, on ne désignait pas
      const g = e.target.closest("g.node");
      if (!g) return;
      const n = +g.dataset.n;
      if (G.sel !== n){ G.sel = n; draw(); if (G.onPick) G.onPick(n); }
      if (e.target.closest("g.nact") && G.onFiche) G.onFiche(n);
    });

    window.addEventListener("resize", () => {
      if (!G.steps.length) return;
      clearTimeout(init._t);
      init._t = setTimeout(() => animateTo(layout(), 240), 90);
    });
  }

  return { state: G, setData, draw, init, camReset,
           etat, byN, coul };
}

/* ═══════════════════════════════════════════════════════════════════════════
   LES NOTIFICATIONS
   ---------------------------------------------------------------------------
   NKIND est repris tel quel : c'est un vocabulaire visuel, pas une donnée.
   Une DÉCISION fait sonner le menu et pose une bulle qui NE part pas toute
   seule ; une information pose une bulle qui s'efface. La différence est le
   fond de l'affaire — on ne peut pas rater ce qui attend son accord.
   ═══════════════════════════════════════════════════════════════════════════ */

const NKIND = {
  decision: { ico: "coffre", col: "var(--accent)", bg: "var(--accent-container)", dur: true },
  panne:    { ico: "eclair", col: "#B3261E",       bg: "#FCE8E6",                 dur: true },
  livrable: { ico: "doc",    col: "var(--green)",  bg: "#C4EED0",                 dur: false },
  auto:     { ico: "boucle", col: "var(--muted)",  bg: "var(--surface-hi)",       dur: false }
};

const Notifs = {
  list: [],
  open: false,
  nid: 0,
  onAnswer: null,        // (notif, oui) => Promise|void

  attente(){ return this.list.filter((n) => NKIND[n.kind] && NKIND[n.kind].dur); },

  drawBell(){
    const ic = document.getElementById("bellIc");
    if (!ic) return;
    const k = this.attente().length;
    const dec = this.list.some((n) => n.kind === "decision");
    ic.innerHTML = svg("cloche", { size: 22, w: 1.6 })
      + (k ? '<span class="badge' + (dec ? " dec" : "") + '">' + k + "</span>" : "");
    // Le menu porte un point sur la fenêtre concernée : on sait où aller sans
    // ouvrir le panneau.
    document.querySelectorAll(".rail-btn").forEach((b) => {
      const l = b.querySelector(".lbl");
      if (!l) return;
      const has = this.attente().some((n) => n.panel === l.textContent.trim());
      let d = b.querySelector(".raildot");
      if (has && !d){ d = document.createElement("span"); d.className = "raildot"; b.appendChild(d); }
      if (!has && d) d.remove();
    });
  },

  toggle(e){
    if (e) e.stopPropagation();
    this.open = !this.open;
    const el = document.getElementById("npanel");
    if (!el) return;
    const rw = document.getElementById("railwrap");
    el.style.left = ((rw ? rw.offsetWidth : 72) + 12) + "px";
    el.classList.toggle("on", this.open);
    if (this.open) this.draw();
  },

  close(){
    this.open = false;
    const el = document.getElementById("npanel");
    if (el) el.classList.remove("on");
  },

  _row(n){
    const K = NKIND[n.kind] || NKIND.auto;
    return '<div class="nrow" data-go="' + esc(n.panel) + '">'
      + '<span class="nic" style="background:' + K.bg + ";color:" + K.col + '">'
      + svg(K.ico, { size: 19 }) + "</span>"
      + '<div style="flex:1;min-width:0">'
      + '<div class="nt">' + esc(n.titre) + "</div>"
      + '<div class="nx">' + esc(n.txt) + "</div>"
      + '<div class="nmeta"><span class="o">' + esc(n.obj) + "</span>·<span>"
      + esc(n.when) + "</span></div>"
      + (K.dur
          ? '<div class="nacts" data-stop="1">'
            + '<button class="yes" data-yes="' + n.id + '">' + esc(n.oui || "Autoriser") + "</button>"
            + '<button class="no" data-no="' + n.id + '">' + esc(n.non || "Refuser") + "</button>"
            + "</div>"
          : "")
      + "</div></div>";
  },

  draw(){
    const host = document.getElementById("npanel");
    if (!host) return;
    const A = this.list.filter((n) => (NKIND[n.kind] || {}).dur);
    const B = this.list.filter((n) => !(NKIND[n.kind] || {}).dur);
    host.innerHTML =
      (A.length ? '<div class="ngroup">À décider · ' + A.length + '<span class="l"></span></div>'
        + A.map((n) => this._row(n)).join("") : "")
      + (B.length ? '<div class="ngroup">Récent<span class="l"></span></div>'
        + B.map((n) => this._row(n)).join("") : "")
      + (this.list.length ? "" : '<div class="empty" style="padding:40px 20px">'
        + '<div class="big">Rien à signaler.</div><div>On vous préviendra.</div></div>');
    this._wire(host);
  },

  _wire(host){
    host.querySelectorAll("[data-yes]").forEach((b) => {
      b.onclick = (e) => { e.stopPropagation(); this.answer(+b.dataset.yes, true); };
    });
    host.querySelectorAll("[data-no]").forEach((b) => {
      b.onclick = (e) => { e.stopPropagation(); this.answer(+b.dataset.no, false); };
    });
    host.querySelectorAll(".nrow").forEach((r) => {
      r.onclick = () => { const p = r.dataset.go; if (p && window.nav){ nav(p); this.toggle(); } };
    });
  },

  answer(id, oui){
    const i = this.list.findIndex((n) => n.id === id);
    if (i < 0) return;
    const n = this.list[i];
    // On retire d'abord pour que l'interface réponde tout de suite, mais on
    // sait remettre : si le serveur refuse, la demande revient à sa place.
    this.list.splice(i, 1);
    this.drawBell(); this.draw();
    const remettre = () => { this.list.splice(i, 0, n); this.drawBell(); this.draw(); };
    let p;
    try { p = this.onAnswer ? this.onAnswer(n, oui) : null; }
    catch (e){ remettre(); snack("Refusé par le serveur : " + e.message); return; }
    if (p && typeof p.then === "function"){
      p.catch((e) => { remettre(); snack("Non transmis : " + e.message); });
    }
    snack("« " + n.titre + " » — " + (oui ? "c'est autorisé." : "refusé."));
  },

  push(n){
    n.id = ++this.nid;
    this.list.unshift(n);
    this.drawBell();
    const b = document.getElementById("bell");
    if (b){ b.classList.add("ring"); setTimeout(() => b.classList.remove("ring"), 760); }

    const K = NKIND[n.kind] || NKIND.auto;
    const host = document.getElementById("toasts");
    if (!host) return n.id;
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = '<span class="nic" style="background:' + K.bg + ";color:" + K.col + '">'
      + svg(K.ico, { size: 19 }) + "</span>"
      + '<div style="flex:1;min-width:0"><div class="nt">' + esc(n.titre) + "</div>"
      + '<div class="nx">' + esc(n.txt) + "</div>"
      + '<div class="nmeta"><span class="o">' + esc(n.obj) + "</span></div>"
      + (K.dur ? '<div class="nacts">'
          + '<button class="yes" data-yes="' + n.id + '">' + esc(n.oui || "Autoriser") + "</button>"
          + '<button class="no" data-no="' + n.id + '">' + esc(n.non || "Refuser") + "</button>"
          + "</div>" : "")
      + "</div>";
    el.querySelectorAll("[data-yes]").forEach((x) => {
      x.onclick = () => { this.answer(+x.dataset.yes, true); el.remove(); };
    });
    el.querySelectorAll("[data-no]").forEach((x) => {
      x.onclick = () => { this.answer(+x.dataset.no, false); el.remove(); };
    });
    host.appendChild(el);
    requestAnimationFrame(() => el.classList.add("on"));
    if (!K.dur){
      setTimeout(() => { el.classList.remove("on"); setTimeout(() => el.remove(), 400); }, 5200);
    }
    return n.id;
  },

  /* Retire une demande sans y répondre — le serveur l'a résolue autrement
     (l'agent a été interrompu, la session est morte). */
  drop(id){
    const i = this.list.findIndex((n) => n.id === id);
    if (i < 0) return;
    this.list.splice(i, 1);
    this.drawBell();
    if (this.open) this.draw();
  }
};

/* ═══ Réglages — les rangées, reprises telles quelles ═════════════════════ */

const ligne = (nm, sub, ctl) =>

/* ═══ Terminal — l'apparence de la fenêtre, sans son contenu inventé ══════ */

const TTHEMES = [
  { id: "nuit",   nm: "Nuit",   bg: "#1E1E1E", fg: "#E8EAED", ac: "#8AB4F8" },
  { id: "encre",  nm: "Encre",  bg: "#0B1220", fg: "#CFE0FF", ac: "#7AA2F7" },
  { id: "papier", nm: "Papier", bg: "#FAF8F5", fg: "#2B2A28", ac: "#0B57D0" },

];

}

</script>
<script>
/* ═══ Banc d'essai. ═══ */
const $ = (id) => document.getElementById(id);
/* Pas de `esc` ici : ulysse-view.js en déclare déjà un au niveau global, et
   deux déclarations du même nom dans deux <script> classiques font une
   SyntaxError qui tue toute la page. On se sert du sien. */

let propose = false, nEtapes = 4, jrnOuvert = false, vue = "both";
const ouvertes = new Set();

/* Les familles d'outils, verbatim d'ulysse-app.js. */
const FAMILLES = {
  lire:     { n:"LECTURE",   c:"#1A73E8" },
  ecrire:   { n:"ÉCRITURE",  c:"#9334E6" },
  executer: { n:"EXÉCUTION", c:"#E8710A" },
  reseau:   { n:"RÉSEAU",    c:"#00838F" }
};

/* Douze appels d'outil plausibles, dans l'ordre. */
/* Les quatre familles apparaissent dès les quatre premières étapes : sur une
   suite qui ne ferait que lire, on ne verrait pas que la couleur porte une
   information. */
const OUTILS = [
  ["fs.list",     "web/",                        "lire",     140],
  ["shell.run",   "node test_page.js",           "executer", 4310],
  ["fs.write",    "web/apercu-plan.html",        "ecrire",   210],
  ["http.get",    "127.0.0.1:9123/api/status",   "reseau",   75],
  ["fs.read",     "web/CONTRAT-INTERFACE.md",    "lire",     90],
  ["grep",        "data-role dans ulysse-app.js","lire",     310],
  ["shell.run",   "python test_serve.py",        "executer", 2180],
  ["fs.edit",     "web/PASSE-DESIGN-PLAN.md",    "ecrire",   160],
  ["fs.read",     "web/AUDIT-ENDPOINTS-REEL.md", "lire",     95],
  ["http.post",   "gateway/webhooks/trigger",    "reseau",   240],
  ["shell.run",   "node test_page.js",           "executer", 4120],
  ["fs.write",    "web/REPRISE.md",              "ecrire",   180]
];

function etapes(){
  return OUTILS.slice(0, nEtapes).map((o, i) => ({
    n: i + 1, t: o[0], d: o[1], team: o[2], ms: o[3],
    result: i === 1 ? "76 vérifications — 76 vertes, 0 rouge" : "",
    /* La dernière est en cours : c'est l'état qui fait vivre le schéma. */
    pct: i === nEtapes - 1 ? 50 : 100
  }));
}

/* Le vrai moteur de la maquette. Son état interne est exposé par `state` —
   c'est par lui qu'on impose des positions sans toucher au moteur. */
const graph = Graph("svg");
const GS = graph.state;
graph.init();

/* ── LE RANGEMENT PROPOSÉ : un serpentin ────────────────────────────────
   Le layout d'origine range par couches. Sur une chaîne, une couche =
   une étape, donc une seule ligne, aussi large que le nombre d'outils.
   Ici on replie : on remplit une rangée, puis on redescend et on repart
   dans l'autre sens — le regard suit le fil sans jamais le perdre. */
/* NW (168) et NH (74) viennent du moteur — ulysse-view.js les déclare au
   niveau global. Les redéclarer ici lève une SyntaxError qui tue la page
   entière, exactement comme pour `esc`. On ne déclare donc que ce qui
   n'existe pas encore, et sous un préfixe. */
const P_M = 34, P_PAS = NW + 62, P_GY = NH + 62;

/* Toutes les rangées se lisent de GAUCHE À DROITE, comme un texte.

   Un serpentin — une rangée sur deux à l'envers — économise le trait de
   retour, mais il fait payer cette économie à chaque lecture : une ligne sur
   deux se lit à contresens, et on doit vérifier le sens avant de lire.
   Un texte ne fait pas ça. On garde donc le retour à la ligne, et c'est au
   TRAIT de se débrouiller pour être lisible (voir retoursChariot()). */
function serpentin(steps, parRangee){
  const pos = {};
  steps.forEach((s, i) => {
    pos[s.n] = { x: P_M + (i % parRangee) * P_PAS,
                 y: P_M + Math.floor(i / parRangee) * P_GY };
  });
  const cols = Math.min(parRangee, steps.length);
  const rows = Math.ceil(steps.length / parRangee);
  return { pos, w: P_M * 2 + cols * NW + (cols - 1) * (P_PAS - NW),
                h: P_M * 2 + rows * NH + (rows - 1) * (P_GY - NH) };
}

/* ── LE TRAIT DE RETOUR À LA LIGNE ──────────────────────────────────────
   Quand l'étape suivante est à gauche de la précédente, le coude du moteur
   revient en arrière à la hauteur de la carte de départ : il traverse toute
   la rangée par-derrière, et on ne sait plus d'où il part.

   On le remplace par le tracé qu'on attend : sortir à droite, longer la
   marge, redescendre dans le couloir entre les deux rangées, revenir à
   gauche, et entrer par la gauche de la suivante. C'est le retour chariot
   d'une machine à écrire — un geste que personne n'a besoin d'apprendre.

   On réécrit l'attribut `d` des tracés déjà posés par le moteur : on les
   retrouve par leur point de départ, qui est unique. Côté produit, c'est
   `coudeAxe()` qui devra connaître ce cas. */
function retoursChariot(steps, edges){
  const svgEl = $("svg");
  const xs = steps.map((s) => GS.POS[s.n].x);
  const droite = Math.max(...xs) + NW + 20;
  const gauche = Math.min(...xs) - 20;

  edges.forEach(([a, b]) => {
    const A = GS.POS[a], B = GS.POS[b];
    if (!A || !B || B.x >= A.x) return;              // pas un retour
    const y1 = A.y + NH / 2, y2 = B.y + NH / 2;
    const couloir = (A.y + NH + B.y) / 2;
    const r = 13;
    const d = "M" + (A.x + NW) + " " + y1
      + " L" + (droite - r) + " " + y1
      + " Q" + droite + " " + y1 + " " + droite + " " + (y1 + r)
      + " L" + droite + " " + (couloir - r)
      + " Q" + droite + " " + couloir + " " + (droite - r) + " " + couloir
      + " L" + (gauche + r) + " " + couloir
      + " Q" + gauche + " " + couloir + " " + gauche + " " + (couloir + r)
      + " L" + gauche + " " + (y2 - r)
      + " Q" + gauche + " " + y2 + " " + (gauche + r) + " " + y2
      + " L" + B.x + " " + y2;

    const prefixe = "M" + (A.x + NW) + " " + y1 + " ";
    svgEl.querySelectorAll("path").forEach((p) => {
      const dd = p.getAttribute("d") || "";
      if (dd.indexOf(prefixe) === 0) p.setAttribute("d", d);
    });
  });
  /* La marge de gauche et de droite doit tenir dans le cadre, sinon le
     trait de retour sort du champ. */
  GS.VUE.w = Math.max(GS.VUE.w, droite + 20);
}

/* ── RANGER AUTOMATIQUEMENT ─────────────────────────────────────────────
   Combien d'étapes par rangée ? La réponse n'est pas un nombre, c'est une
   FORME : celle du volet. On essaie toutes les largeurs possibles et on
   garde celle dont le schéma ressemble le plus au cadre qui l'accueille —
   c'est celle qui laissera le moins de vide et exigera le moins de zoom.

   Le volet change de forme dès qu'on passe de « Les deux » à « Schéma », ou
   qu'on redimensionne la fenêtre. C'est là que le bouton sert : il ne
   « remet pas à zéro », il RANGE pour l'écran qu'on a maintenant. */
function largeurIdeale(steps){
  const b = $("paneG").getBoundingClientRect();
  const cible = (b.width && b.height) ? b.width / b.height : 1.6;
  let best = 1, ecart = Infinity;
  for (let c = 1; c <= steps.length; c++){
    const S = serpentin(steps, c);
    const e = Math.abs(Math.log((S.w / S.h) / cible));   // log : 2× trop large
    if (e < ecart){ ecart = e; best = c; }               // pèse comme 2× trop haut
  }
  return best;
}

function ranger(dire){
  const steps = etapes();
  if (!steps.length) return;
  const par = largeurIdeale(steps);
  const S = serpentin(steps, par);
  GS.VUE.w = S.w; GS.VUE.h = S.h;
  Object.assign(GS.POS, S.pos);
  graph.camReset();
  bouge = false;
  graph.draw();
  colorier();
  retoursChariot(steps, steps.slice(1).map((s) => [s.n - 1, s.n]));
  majCam();
  if (dire) souffle("Rangé pour la forme du volet : "
    + par + (par > 1 ? " étapes" : " étape") + " par rangée.");
}

/* ── LES NŒUDS SONT LIBRES ──────────────────────────────────────────────
   On peut prendre une carte et la poser ailleurs. C'est ce qui fait la
   différence entre un schéma qu'on regarde et une carte dont on se sert :
   quand douze étapes se ressemblent, on écarte celle qu'on surveille, on
   rapproche celles qu'on compare, et on garde SA disposition le temps de
   comprendre.

   Ce qui rend la chose supportable, c'est de pouvoir tout défaire d'un
   geste — c'est le bouton « ranger », qui reprend ici tout son sens.

   Le moteur écoute déjà `mousedown` sur le SVG pour déplacer la caméra. On
   se place donc en CAPTURE, avant lui : si le geste part d'une carte, il
   est pour la carte, et on l'empêche de descendre jusqu'à la caméra. */
let bouge = false;
(function nœudsLibres(){
  const el = $("svg");
  let pris = null;

  const unite = () => {
    const r = el.getBoundingClientRect();
    return r.width ? (GS.VUE.w + 24) / r.width / GS.CAM.k : 1;
  };

  el.addEventListener("mousedown", (e) => {
    if (!propose || e.button !== 0) return;
    const g = e.target.closest("g.node");
    if (!g) return;
    const n = +g.dataset.n;
    if (!GS.POS[n]) return;
    e.stopPropagation();                 // la caméra ne doit pas s'en saisir
    e.preventDefault();
    pris = { n, x: e.clientX, y: e.clientY,
             ox: GS.POS[n].x, oy: GS.POS[n].y, seuil: false };
    el.classList.add("p-prise");
  }, true);

  window.addEventListener("mousemove", (e) => {
    if (!pris) return;
    const dx = e.clientX - pris.x, dy = e.clientY - pris.y;
    /* Même seuil que le moteur : sans lui, tout clic déplacerait d'un pixel
       et on ne pourrait plus jamais désigner une carte. */
    if (!pris.seuil && Math.abs(dx) + Math.abs(dy) < 4) return;
    pris.seuil = true;
    const u = unite();
    GS.POS[pris.n] = { x: Math.round(pris.ox + dx * u),
                       y: Math.round(pris.oy + dy * u) };
    const steps = etapes();
    graph.draw();
    colorier();
    retoursChariot(steps, steps.slice(1).map((s) => [s.n - 1, s.n]));
  });

  window.addEventListener("mouseup", () => {
    if (!pris) return;
    if (pris.seuil){ bouge = true; majCam(); }
    pris = null;
    el.classList.remove("p-prise");
  });
})();

function dessine(){
  const steps = etapes();
  const edges = steps.slice(1).map((s) => [s.n - 1, s.n]);

  $("planMeta").textContent = steps.length
    ? "session 4f2a · en cours" : "aucune session";
  $("planStop").style.display = steps.length ? "" : "none";
  $("pTitre").textContent = propose ? "Ce que fait l'agent" : "Plan";

  graph.setData(steps, edges, FAMILLES);

  /* En « Proposé », on impose le serpentin par-dessus le rangement par
     couches. Le moteur est le même : on ne remplace que les positions. */
  if (propose && steps.length){
    /* Le rangement n'est pas un réglage : il se recalcule pour la forme du
       volet à chaque fois. Le bouton « ranger » ne fait donc rien d'autre
       que ce que la page fait déjà — il le refait après qu'on a tiré et
       zoomé, ce qui est précisément le moment où on en a besoin. */
    const S = serpentin(steps, largeurIdeale(steps));
    Object.assign(GS.POS, S.pos);
    GS.VUE.w = S.w; GS.VUE.h = S.h;
  }
  graph.draw();
  if (propose){ colorier(); retoursChariot(steps, edges); }

  /* ── Le volet Détail ── */
  if (!steps.length){
    $("steps").innerHTML = propose
      ? '<div class="p-vide"><div class="empty">'
        + '<div class="big">Rien encore.</div>'
        + "<div>Les étapes apparaîtront dès que l'agent utilisera un outil.</div></div>"
        + '<div class="u-todo" id="uTodo">Rien n\'apparaît alors que l\'agent travaille ? '
        + '<span class="p-lien" id="uTodoL">Pourquoi</span>'
        + '<div class="p-repli">Le réglage Hermès <code>display.tool_progress</code> est '
        + "à <b>off</b> : les événements d'outil ne sont pas émis. Il se change par le "
        + "RPC <code>config.set</code>.</div></div></div>"
      : '<div class="empty" style="padding:36px 20px">'
        + '<div class="big">Rien encore.</div>'
        + "<div>Les étapes apparaîtront dès que l'agent utilisera un outil.</div></div>"
        + '<div class="u-todo">Si l\'agent travaille et que rien n\'apparaît, c\'est que '
        + "le réglage Hermès <code>display.tool_progress</code> est à off. Il se change "
        + "par le RPC <code>config.set</code>.</div>";
    const l = $("uTodoL");
    if (l) l.onclick = () => $("uTodo").classList.toggle("on");
    majPied(0);
    majCam();
    majNote();
    return;
  }

  $("steps").innerHTML = steps.map((s) => {
    const fam = FAMILLES[s.team];
    return '<div class="exp ' + (ouvertes.has(s.n) ? "open" : "") + '" data-n="' + s.n + '">'
      + '<div class="exp-h">'
      + '<button class="exp-t" data-t="' + s.n + '"><span class="n">' + s.n + "</span>"
      + '<span class="t">' + esc(s.t) + "</span>"
      + (fam ? '<span class="chip">' + esc(fam.n.toLowerCase()) + "</span>" : "")
      + "</button>"
      + (propose
          ? '<button class="dots" data-act="' + s.n + '" aria-label="Actions de l\'étape">'
            + svg("points", { size: 18 }) + "</button>"
          : "")
      + '<button class="chev" data-t="' + s.n + '" tabindex="-1" aria-hidden="true">'
      + svg("chevron", { size: 20 }) + "</button></div>"
      + '<div class="exp-b"><div class="in"><p>' + esc(s.d) + "</p>"
      + (s.result ? '<pre class="u-raw">' + esc(s.result) + "</pre>" : "")
      + '<span class="auto-note">' + (s.pct === 100
          ? "Terminée en " + (s.ms > 1000 ? (s.ms/1000).toFixed(1) + " s" : s.ms + " ms")
          : "En cours…") + "</span>"
      + "</div></div>"
      /* Les actions de l'étape. Elles vivent SOUS la ligne, pas dans un
         menu flottant : elles appartiennent à l'étape, elles ne survolent
         pas la liste. `.sactions` vient de la maquette. */
      + (propose ? '<div class="sactions">'
          + '<button data-a="fiche|' + s.n + '">' + svg("suivant", { size: 16 })
            + " Tout savoir</button>"
          + '<button data-a="fichier|' + s.n + '">' + svg("doc", { size: 16 })
            + " Ouvrir le fichier</button>"
          + '<button data-a="copier|' + s.n + '">' + svg("copier", { size: 16 })
            + " Copier le détail</button>"
          + '<button data-a="rejouer|' + s.n + '">' + svg("relancer", { size: 16 })
            + " Rejouer cet outil</button>"
          + '<button class="regle" data-a="accord|' + s.n + '">'
            + svg("prise", { size: 16 }) + " Me demander avant « " + esc(s.t)
            + " »</button>"
          + "</div>" : "")
      + "</div>";
  }).join("")
  + (jrnOuvert ? '<div class="u-jrn">' + JOURNAL.map((e) =>
      '<div><span class="h">' + e[0] + '</span><span class="y">' + e[1]
      + '</span><span class="b">' + esc(e[2]) + "</span></div>").join("") + "</div>" : "");

  $("steps").querySelectorAll("[data-t]").forEach((b) => {
    b.onclick = () => {
      const n = +b.dataset.t;
      if (ouvertes.has(n)) ouvertes.delete(n); else ouvertes.add(n);
      dessine();
    };
  });

  /* Le kebab de l'étape : il ouvre ses actions sous elle. */
  $("steps").querySelectorAll("[data-act]").forEach((b) => {
    b.onclick = (e) => {
      e.stopPropagation();
      const el = b.closest(".exp");
      const ouvert = el.classList.contains("exp-acts");
      $("steps").querySelectorAll(".exp").forEach((x) => x.classList.remove("exp-acts"));
      el.classList.toggle("exp-acts", !ouvert);
    };
  });
  $("steps").querySelectorAll("[data-a]").forEach((b) => {
    b.onclick = (e) => {
      e.stopPropagation();
      const [a, n] = b.dataset.a.split("|");
      if (a === "fiche") return fiche(+n);
      souffle({ fichier: "Ouvrirait le fichier dans l'Établi.",
                copier:  "Détail copié.",
                rejouer: "Relancerait cet outil avec les mêmes arguments.",
                accord:  "Cet outil demanderait votre accord avant de s'exécuter." }[a]);
    };
  });

  /* Double-clic sur une étape : sa fiche. Le même geste que le ⋯ du nœud. */
  $("steps").querySelectorAll(".exp").forEach((el) => {
    el.ondblclick = (e) => {
      if (e.target.closest(".sactions")) return;
      fiche(+el.dataset.n);
    };
  });

  majPied(steps.length);
  majCam();
  majNote();
}

/* Un mot qui passe, pour dire ce qu'une action ferait — l'aperçu ne fait
   rien pour de vrai. */
let souffleT = null;
function souffle(t){
  let el = $("apSouffle");
  if (!el){
    el = document.createElement("div");
    el.id = "apSouffle";
    el.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:22px;"
      + "z-index:900;background:#1F1F1F;color:#fff;font-size:12.5px;padding:9px 18px;"
      + "border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.35);transition:opacity .25s";
    document.body.appendChild(el);
  }
  el.textContent = t;
  el.style.opacity = "1";
  clearTimeout(souffleT);
  souffleT = setTimeout(() => { el.style.opacity = "0"; }, 2600);
}

/* ── LES NŒUDS PRENNENT LEUR COULEUR ────────────────────────────────────
   La maquette met la couleur de famille dans le liseré, dans le mot
   « LECTURE » et dans le lien — mais la carte elle-même reste blanche
   (`.node .b{fill:var(--bg)}`), et les terminées ne reçoivent qu'un voile
   à 8 %. Sur une suite d'outils qui lisent tous des fichiers, le schéma
   paraît monochrome : la couleur est là, elle ne porte pas.

   On remplit donc la carte de sa propre couleur, à faible densité. La règle
   d'origine est respectée — « un glyphe plein n'est jamais un aplat : c'est
   sa propre couleur à 18 % » — appliquée cette fois à la carte entière.

   Le moteur ne peut pas le faire en CSS : la couleur de famille arrive en
   attribut `stroke`, et aucune règle ne sait la lire. Elle doit être posée
   en `fill` par le dessin. Ici on la relit après coup, ce qui suffit à
   montrer l'effet ; côté produit, c'est `draw()` qui devra poser le `fill`.
   ───────────────────────────────────────────────────────────────────── */
function hexA(h, a){
  const n = parseInt(h.slice(1), 16);
  return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255)
    + "," + a + ")";
}
function colorier(){
  document.querySelectorAll("#svg g.node").forEach((g) => {
    const b = g.querySelector("rect.b");
    if (!b) return;
    const c = b.getAttribute("stroke");
    if (!c || c[0] !== "#") return;
    /* Terminée : la couleur pleine et calme. En cours : un peu plus dense,
       parce que c'est là que le regard doit tomber en premier. */
    b.setAttribute("fill", hexA(c, g.classList.contains("st-run") ? 0.19 : 0.12));
  });
}

/* La fiche d'une étape — ouverte par le ⋯ du nœud, par « Tout savoir », ou
   par un double-clic sur la ligne. Trois chemins, une seule fiche. */
function fiche(n){
  const s = etapes().find((x) => x.n === n); if (!s) return;
  const fam = FAMILLES[s.team];
  $("ficheBody").innerHTML = '<div class="fhead"><h2>' + esc(s.t) + "</h2>"
    + '<div class="sub">' + (s.pct === 100 ? "Terminée" : "En cours")

}
GS.onFiche = fiche;
GS.onPick = (n) => { ouvertes.add(n); dessine(); };

/* ── La caméra : l'échelle, et le recentrage par un clic dessus ──────────
   Le moteur sait déjà zoomer à la molette autour du pointeur et se laisser
   tirer. Ce qui manquait, c'est de le DIRE : sans échelle affichée, on ne
   sait pas qu'on peut zoomer, ni de combien on s'est éloigné. */
function majCam(){
  $("pCam").style.display = propose ? "flex" : "none";
  $("pCamK").textContent = Math.round(GS.CAM.k * 100) + " %";
  if (!$("pCamAuto").innerHTML) $("pCamAuto").innerHTML = svg("noeuds", { size: 17 });
  /* Le bouton s'allume dès que la caméra n'est plus à plat : on ne cherche
     pas « comment revenir », on le voit. */
  const plat = GS.CAM.k === 1 && GS.CAM.x === 0 && GS.CAM.y === 0;
  $("pCam").classList.toggle("deplace", !plat || bouge);
}
function zoom(f){
  GS.CAM.k = Math.min(3, Math.max(0.45, GS.CAM.k * f));
  const g = document.getElementById("gzoom");
  if (g) g.setAttribute("transform",
    "translate(" + GS.CAM.x + " " + GS.CAM.y + ") scale(" + GS.CAM.k + ")");
  majCam();
}
$("pCamP").onclick = () => zoom(1.15);
$("pCamM").onclick = () => zoom(1 / 1.15);
$("pCamK").onclick = () => { graph.camReset(); majCam(); };
$("pCamAuto").onclick = () => ranger(true);
/* Une lettre, parce qu'on y revient souvent et qu'on a la main sur la carte. */
document.addEventListener("keydown", (e) => {
  if (!propose || (e.key !== "a" && e.key !== "A")) return;
  /* e.target peut être le document lui-même, qui n'a pas de closest() —
     et une exception ici tuerait tous les autres écouteurs de la touche. */
  const t = e.target;
  if (t && t.closest && t.closest("input,textarea")) return;
  ranger(true);
});
/* La molette du moteur ne nous prévient pas : on relit l'échelle après coup. */
$("svg").addEventListener("wheel", () => setTimeout(majCam, 0), { passive: true });
$("svg").addEventListener("mouseup", () => setTimeout(majCam, 0));
$("sNode").onclick = (e) => { if (e.target.id === "sNode") $("sNode").classList.remove("on"); };

/* ── Les commutateurs de l'aperçu ───────────────────────────────────────── */

  b.classList.add("on");

};

      + "<h4>Et trois petites choses</h4><ul>"

      + "<h4>Une question de mot</h4>"

    : "<b>Actuel</b> — l'état du produit."
      + "<h4>À essayer</h4><ul>"
